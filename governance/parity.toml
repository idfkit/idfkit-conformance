# Python: write_idf, write_epjson (splitting into write_* and save_* in the rename batch)
# TypeScript: writeIdf, writeEpJson, toEpJson, writeObject, saveIdf, saveEpJson
# CLOSED 2026-09-04, feature 002.
#
# Five controls closed it: three into the first language (indent, comment column, ordering) and two
# reckoned from the other direction (compressed output into the second, comment-free output already
# on both). No writer default moved, and six of them are pinned by tests in each library
# specifically so that a slipped default is a red test rather than a discovery.
#
# THE SEVEN DEFAULT-OUTPUT DIFFERENCES DID NOT GO AWAY. They moved, because the gate rejects a
# `differences` field on a capability that is not partial, and a reader still meets them the first
# time they diff two files. They now live at
# `idfkit-developers/docs/explanation/two-writers-one-model.md`, which carries `parity("write")`,
# states the measurement (5ZoneAirCooled.idf from EnergyPlus 26.1.0, 359 objects, 4,031 lines
# against 4,125, re-measured on the day it closed), and says plainly that neither writer is more
# correct, that both are published, and that byte-identical output is not promised and is not
# coming.
#
# If that page is ever deleted, this information exists nowhere. That is the cost of closing an
# entry whose `differences` field was doing real work, and it is recorded here so the next person
# to tidy the documentation knows what they would be removing.
#
# The controls are proven by five corpus cases, one per control, under `writer-option-*`. One case
# per control rather than one setting all five, so a failure names the control that broke. The
# comparison is structural: each case writes its document under the control, re-reads it, and
# compares parsed values, because comparing text would fail for the seven reasons above.
#
# Not in this entry: a lossless mode. `lossless-round-trip` is a separate Tier 2 entry, absent in
# the second language and tracked as not yet ported.
#
# EVERY CONTROL NOW EXISTS ON BOTH SIDES. Two were still one-sided when this entry first moved to
# complete: the first language's `ordering` and the second's `versionFirst`. The entry argued at the
# time that neither gave a caller output the other writer could not produce, which was true and was
# not what SC-007 asked for, and US4's second acceptance scenario named object ordering explicitly.
# Both controls were added rather than the gap argued away, and all four option names are registered
# as concepts in naming.toml.
#
# `writer-option-ordering` in the corpus checks something on both sides as a result. It did not
# before: `source` was already the second writer's only behaviour, so the case would have passed
# there even if the runner had dropped the option.
[[capability]]
id         = "write"
title      = "Writing IDF and epJSON"
tier       = "tier-1"
python     = "complete"
typescript = "complete"
names      = [
  "serialize IDF to a string",
  "serialize epJSON to a string",
  "write IDF to disk",
  "write epJSON to disk",
  "serialize a document to an epJSON value",
  "serialize one object",
]

