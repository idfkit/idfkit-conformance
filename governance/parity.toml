# ---------------------------------------------------------------------------
# never: permanently single-language. Two mechanisms, never merged (FR-068, FR-078).
#
# Simulation appears TWICE and visual output appears TWICE. Each pair is two capabilities delivered
# by fundamentally different means, and collapsing either pair into one entry would make one
# language read as deficient at something it does not lack.
# ---------------------------------------------------------------------------

# Python: idfkit.simulation simulate, simulate_batch, async_simulate, async_simulate_batch,
#         async_simulate_batch_stream, find_energyplus, expand_objects, run_preprocessing,
#         run_slab_preprocessor, run_basement_preprocessor, needs_ground_heat_preprocessing,
#         EnergyPlusConfig, SimulationResult, BatchResult, SimulationCache, CacheKey,
#         SimulationJob, SimulationProgress, SimulationEvent, ProgressParser, tqdm_progress,
#         the FileSystem family, and the result readers (ESOResult, CSVResult, SQLResult,
#         TimeSeriesResult, ErrorReport, TabularRow, EnvironmentInfo, VariableInfo)
#
# Narrowed on purpose: this entry covers running a locally installed EnergyPlus and reading the
# files that run writes. Choosing which variables to ask for is `output-variable-selection` and
# drawing the results is `result-plotting`; both are pure and both are portable, so neither belongs
# under a permanent absence.
[[capability]]
id         = "local-simulation"
title      = "Running a locally installed EnergyPlus and reading its results"
tier       = "never"
python     = "complete"
typescript = "absent"
absence_kind = "never"
note       = """
Requires an EnergyPlus installation on the machine and a subprocess to drive it, then reads the
eplusout files that run leaves on disk. Neither the installation nor the subprocess is available in
a browser, which is the runtime the JavaScript library targets. JavaScript reaches EnergyPlus by
the other mechanism instead: see `browser-simulation`, which is not a workaround for this entry but
a different capability.
"""
names      = [
  "the local simulation surface",
]

# TypeScript: @idfkit/engine (createEnergyPlus, expandObjects, detectExternalFileReferences) with
#             @idfkit/engine-assets, both installed by name and neither reachable through the
#             shared install name.
[[capability]]
id         = "browser-simulation"
title      = "Running EnergyPlus in the browser"
tier       = "never"
python     = "absent"
typescript = "complete"
absence_kind = "never"
note       = """
Delivered by @idfkit/engine, installed separately and deliberately not part of the shared install
name: not a subpath, not a dependency, not an optional peer (research R19). The WebAssembly build
exists to reach a runtime Python does not target, so Python has no counterpart and is not getting
one. @idfkit/engine-assets is roughly 51 MB and versions on the EnergyPlus release it carries,
while the loader versions on its own API, which is a second reason the facade does not carry it.

This is not a gap in Python. Python runs EnergyPlus by the other mechanism: see
`local-simulation`.
"""
# No `names`: the naming register governs `idfkit` and `@idfkit/core`, and @idfkit/engine is
# reachable only by its own install name. Registering its names would imply the shared surface
# carries it, which is the claim this entry exists to deny.
names      = []

# Python: idfkit.visualization, nine exports, verified at authoring time: ColorBy,
#         ModelViewConfig, SVGConfig, construction_to_svg, generate_construction_svg,
#         view_exploded, view_floor_plan, view_model, view_normals.
#
# All nine produce a vector image: construction_to_svg and generate_construction_svg emit SVG
# cross-sections of a construction assembly, and the four view_* functions emit plotly figures of
# the model. Vector output, drawn once and handed back. This is not the same mechanism as a
# real-time rendered scene: see `scene-rendering`.
[[capability]]
id         = "svg-visualisation"
title      = "Rendering a model to a vector image"
tier       = "never"
python     = "complete"
typescript = "absent"
absence_kind = "never"
note       = """
A Python-side capability with no JavaScript counterpart and no plan for one. The output is a static
vector image produced for a notebook, a report, or a file on disk, which is a Python workflow. A
JavaScript caller wanting to look at a model is already in a runtime that draws, and is served by
the other mechanism: see `scene-rendering`. Recording the two as one `visualization` entry would
make each language read as missing something the other has, which is exactly the failure FR-078
and FR-068 forbid.
"""
names      = [
  "the vector image surface",
]

# TypeScript: @idfkit/viewer, installed by its own name. Built outside this feature, and
#             deliberately NOT reserved on the facade's export map or in the naming register: the
#             renderer is not reachable through the shared install name (FR-078, data-model.md).
[[capability]]
id         = "scene-rendering"
title      = "Rendering a three-dimensional scene"
tier       = "never"
python     = "absent"
typescript = "complete"
absence_kind = "never"
note       = """
Delivered by @idfkit/viewer, installed by its own name like the simulation engine, and NOT reachable
through the shared install name: no subpath, no dependency, no export-map entry, and no reserved
name in the naming register. A reader reaches it by installing it explicitly, and the documentation
says so rather than implying the facade carries it.

Python has no counterpart and is not getting one. A real-time interactive scene needs a rendering
context that a Python process does not have, and Python's static vector output is a different
mechanism serving a different workflow: see `svg-visualisation`. Neither is a gap in the other.
"""
# No `names`: @idfkit/viewer is deliberately absent from the naming register, which says so in
# its reserved-package section. Registering a concept for it here would imply the shared surface
# carries it, which is the claim this entry exists to deny.
names      = []

# Python: the eppy compatibility mixin on IDFDocument (idfkit/_compat.py, idfkit/_compat_object.py):
#         idfobjects, newidfobject, addidfobject, popidfobject, removeidfobject, saveas, and the
#         rest of the eppy-shaped surface.
[[capability]]
id         = "eppy-compatibility"
title      = "eppy compatibility surface"
tier       = "never"
python     = "complete"
typescript = "absent"
absence_kind = "never"
note       = """
A Python ecosystem concern with no JavaScript counterpart. These methods exist solely so that code
written against eppy keeps working after a move to idfkit; every one of them names an idfkit
alternative in its own docstring. There is no eppy in JavaScript, so there is nothing to be
compatible with. Listed explicitly so it is never ported by mistake.
"""
names      = [
  "eppy compatibility surface",
]