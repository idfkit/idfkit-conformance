# The parity ledger: every public capability of the two idfkit libraries, the languages that
# implement it, and the tier it belongs to. FR-034, FR-046 to FR-050, FR-068, FR-075 to FR-078.
#
# HOW THIS FILE IS READ
#
# Consumers read this file at a pinned `governance-YYYY.N` tag, never from the default branch
# (FR-081). A gate or a documentation build that followed the branch would change its verdict
# without any change landing in the repository it is gating, which is the failure this pinning
# exists to prevent.
#
# Three things consume it:
#
#   1. `idfkit-developers/docs/explanation/parity.md` (T124) renders entirely from this file. Nothing on that
#      page is hand-written, so a hand-edited page can never disagree with the source.
#   2. The `parity(id)` documentation macro (T125, T126) resolves its argument against the `id`
#      field below, renders an explicit statement of unavailability in the affected language and
#      nothing in the other, and FAILS THE BUILD when the argument resolves to nothing.
#   3. `idfkit/scripts/check_parity_ledger.py` and `idfkit-js/scripts/check-parity-ledger.mjs`
#      (T128, T129) diff the exported capability set of each library against this file.
#
# Because both the rendered page's anchors and the macro's argument are the `id`, EVERY `id` BELOW
# IS A STABLE PUBLIC IDENTIFIER. Renaming one breaks inbound links and breaks every page that
# declares the capability. Add and deprecate ids; do not rename them.
#
# SCHEMA (contracts/parity-ledger.md)
#
#   id            slug, stable, required
#   title         reader-facing string, required
#   tier          "tier-1" | "tier-2" | "tier-3" | "never", required
#   python        "complete" | "partial" | "absent", required
#   typescript    "complete" | "partial" | "absent", required
#   absence_kind  "not-yet" | "never", required when either side is "absent"
#   differences   non-empty string, required when either side is "partial"
#   issue         tracking URL, required when absence_kind = "not-yet"
#   note          string, required when absence_kind = "never"
#   names         list of naming-register concepts, required
#
# RULES THAT SHAPE THE ENTRIES BELOW
#
#   One entry per mechanism (FR-068). Where both languages do something recognisably similar by
#   fundamentally different means, that is two capabilities, not one. Recorded as one entry,
#   whichever language the entry is written from makes the other read as deficient. Simulation and
#   visual output are both split for exactly this reason: see `local-simulation` /
#   `browser-simulation` and `svg-visualisation` / `scene-rendering`.
#
#   `never` is terminal. Moving a `never` capability to any other state requires a constitutional
#   amendment, not an edit to this file.
#
#   Same-change updates (FR-048). A change that lands or removes a capability updates this file in
#   that same change, never afterwards.
#
#   Tracking issues are real, not placeholders. Every `absence_kind = "not-yet"` entry carries the
#   URL of an open issue in idfkit-js, opened at governance-2026.3. The gate rejects a `not-yet`
#   entry with no issue, so a fabricated URL would be worse than a missing one: it would pass and
#   dead-link the reader. Check that an issue exists before writing its address here.


# ---------------------------------------------------------------------------
