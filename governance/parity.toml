# Python: idfkit._generated_types (regenerated by idfkit.codegen.generate_stubs, diffed by
#         `make check-stubs`), applied through idfkit/document.pyi
# TypeScript: @idfkit/core/types/v26-1 and /v9-4, AnyTypeMap, UntypedMap, ObjectOf, TypeNameOf,
#             ValuesOf
[[capability]]
id         = "generated-object-types"
title      = "Static types generated from the schema"
tier       = "tier-1"
python     = "partial"
typescript = "complete"
differences = """
Coverage differs, and the difference is visible to anyone not on the newest release. The Python
stub set is generated for one EnergyPlus version at a time and is currently shipped for 26.1.0
only, so a model loaded at 9.4 gets the 26.1 field names and choice lists from the editor. The
TypeScript type maps are emitted per version and selected by the caller, who parameterises the
document with the map for the version being read, so an older model is typed as that older model
or is left untyped rather than mistyped.

Application differs too. Python's stubs apply implicitly to every document. TypeScript's are opt-in
by construction: an unparameterised document stays untyped, which is what version-generic code
needs.
"""
names      = [
  "generated object types",
  "a version type map",
]

# Python: IDFParseError carries ParseDiagnostic entries; non-fatal problems go to the logger
# TypeScript: ParseResult.diagnostics, ParseDiagnostic, LexDiagnostic, loadIdfWithDiagnostics
#
# THIS ENTRY IS THE IDF PARSER, AND ONLY THE IDF PARSER.
#
# The title said "a parse" until 2026-09-04 and was narrowed, because the two formats are not in the
# same state and one entry covering both cannot be marked complete without saying something false.
#
# The epJSON parsers do not agree, and feature 002 did not close it. TypeScript's builds diagnostics
# the same way its IDF parser does (packages/core/src/parse/epjson.ts:25-30, :37, :83). Python's
# builds none at all: `_parse_objects` drops a malformed object type at epjson_parser.py:226 and a
# malformed object at :246, in both cases with a bare `continue`, so the caller cannot tell a file
# that never held the object from one where it was discarded. No exception, no log line, no
# diagnostic.
#
# This is recorded rather than closed, per Principle III, and it is why the entry's scope is narrow.
# It is a real one-sided gap and it outlives this entry's move to complete: `differences` is deleted
# when a capability stops being partial, so the note lives here, in a comment, where the closure
# cannot take it away. Closing it means giving Python's epJSON parser the diagnostics its IDF parser
# now has, and belongs to whichever feature takes it.
[[capability]]
id         = "parse-diagnostics"
title      = "Diagnostics from an IDF parse"
tier       = "tier-1"
python     = "partial"
typescript = "complete"
differences = """
Both libraries produce diagnostics for a malformed input; only one hands them back. Python raises
IDFParseError carrying the diagnostics that stopped the parse, and reports the recoverable ones
(skipped malformed objects, discarded formatting trees, surplus fields on a non-extensible type)
through the logging module, where a caller who wants them must install a handler. TypeScript
returns them: parseIdf and loadIdfWithDiagnostics both yield a ParseResult whose `diagnostics`
array holds the non-fatal findings alongside the document.

This matters to the conformance corpus, whose `diagnostics` assertion compares what each side
reports for a malformed case (contracts/conformance-corpus.md).
"""
names      = [
  "a parse diagnostic",
  "diagnostics from a parse",
  "recoverable diagnostics from a parse",
  "a document and its parse findings",
]

# Python: idfkit.weather StationIndex (load, search, check_for_updates), WeatherStation,
#         SearchResult, SpatialResult, haversine_km
# TypeScript: @idfkit/weather StationIndex, WeatherStation, SearchResult, SpatialResult,
#             MatchField, StationRecord, IndexData, loadStationIndex, refreshStationIndex,
#             checkForUpdates, indexFromData, parseKml, parseUrlMetadata, haversineKm,
#             INDEX_FILES, SOURCES_BASE_URL, and @idfkit/weather/node loadBundledIndex
#
# Finding a station only. Retrieving the station's files is `weather-download`, and the on-disk
# cache Python keeps for them is `weather-file-cache`. Splitting the three is FR-068: one entry
# covering all of them would have to describe a browser-side retrieval, a cached retrieval, and an
# index lookup as one thing, and would make each language read as deficient at part of it.
[[capability]]
id         = "weather-index"
title      = "The weather station index"
tier       = "tier-1"
python     = "complete"
typescript = "partial"
differences = """
Installation differs, and the difference is deliberate. `pip install idfkit` installs weather and
its station index unconditionally, because Python extras gate dependencies rather than files, so a
Python reader has weather whether or not they wanted it. `npm install idfkit` installs neither:
weather is an opt-in peer there, added with `npm install @idfkit/weather`. Both libraries ship
their own index once installed and neither retrieves one to get started (FR-043, FR-075,
research R11). A JavaScript reader who follows a weather page without installing that package
gets a resolution error, not a smaller feature, which is why the packaging is recorded here as a
stated difference rather than left as an undescribed detail.

Freshness handling differs. Python fires a throttled nudge from StationIndex.load(): at most once
every 24 hours it probes the upstream KML files, warns when the bundled or cached index is behind,
records the check under the cache directory, and can be turned off with
IDFKIT_NO_WEATHER_UPDATE_CHECK. JavaScript has no such nudge and no timestamp to throttle against.
It exposes checkForUpdates and refreshStationIndex for a caller who asks, and does nothing on its
own, because the nudge is built on a writable cache directory and a browser-targeted package has
none. The consequence for a reader is concrete: a stale index goes unmentioned in JavaScript until
they check for themselves.

The installation difference above is the whole weather surface's, not the index's alone. It is
stated here because the index is where a reader meets it first, and `weather-download` and
`weather-file-cache` refer back to it rather than repeat it.
"""
names      = [
  "the station index",
  "search stations",
  "a weather station",
  "refresh the station index",
  "a text search result",
  "a proximity search result",
  "which field a text search matched",
  "the station wire record",
  "the upstream index base URL",
  "fetch a prebuilt station index",
  "parse a KML station index",
  "read station metadata from a download URL",
  "great-circle distance between two points",
  "the weather options-object types",
  "the station index wire form",
  "build an index from index data",
  "the upstream index file list",
  "the bundled station index",
  "check the station index for updates",
]

# Python: idfkit.weather WeatherDownloader (download, get_epw, get_ddy, get_epw_by_filename,
#         get_ddy_by_filename), WeatherFiles, PartialWeatherFiles
# TypeScript: @idfkit/weather fetchWeatherFiles, fetchEpw, fetchEpwByFilename, fetchWeatherArchive,
#             WeatherFiles, FetchWeatherOptions, FetchLike, unzip, and @idfkit/weather/node
#             saveWeatherFiles, SavedWeatherFiles
#
# Getting the files, once `weather-index` has found the station. The on-disk cache Python keeps
# them in is `weather-file-cache`, which is a separate and permanent asymmetry rather than part of
# what either library does to retrieve.
[[capability]]
id         = "weather-download"
title      = "Retrieving weather and design-day files"
tier       = "tier-1"
python     = "complete"
typescript = "partial"
differences = """
Both libraries retrieve a station's ZIP archive from climate.onebuilding.org and unpack the EPW,
DDY, and STAT members out of it. What they hand back differs, and it differs in the first line a
reader writes. Python's WeatherDownloader.download returns a WeatherFiles whose epw, ddy, stat, and
zip_path are Path objects, because the files are on disk by the time it returns and a path is what
EnergyPlus is given. TypeScript's fetchWeatherFiles returns a WeatherFiles whose epw, ddy, and stat
are the file TEXT, alongside a members map holding every archive member as bytes, because a browser
has no disk and the text is what @idfkit/engine takes. Same name, different values, which the
naming register records under `the retrieved weather files`: code written from one language's
documentation is wrong at runtime against the other rather than merely awkward.

Three things exist on one side only, and each follows from that one fact rather than from a gap.
Python's download(station, only={".epw"}) extracts a chosen subset and returns PartialWeatherFiles;
selective extraction is a property of writing into a cache, and the JavaScript side decodes from
memory whatever the archive held. TypeScript's FetchWeatherOptions carries fetch, rewriteUrl, and
signal, because climate.onebuilding.org sends no Access-Control-Allow-Origin header and a page can
reach it only through a proxy the caller supplies; Python runs under no same-origin policy and owns
its own urllib requests. TypeScript splits retrieving from writing, so @idfkit/weather/node adds
saveWeatherFiles and SavedWeatherFiles, where in Python the two are one operation.

Resolving a canonical EPW filename differs in one argument. Python's index parameter is optional and
defaults to the bundled index, because it can always find one on disk. TypeScript's is required,
because the caller had to obtain an index already and the function has nowhere to load one from.

typescript = "partial" records the missing selective extraction and nothing else. It is not a
verdict on the on-disk cache: that is `weather-file-cache`, which is permanently absent by decision
rather than missing.
"""
names      = [
  "download a weather file",
  "download a station's EPW file",
  "download an EPW file by filename",
  "download a station's archive",
  "the retrieved weather files",
  "read a ZIP archive",
  "the injectable fetch",
  "write weather files to disk",
  "the written weather file paths",
]

