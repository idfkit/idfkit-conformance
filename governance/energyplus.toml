  [[project.opens_on]]
  kind = "published"
  index = "pypi"
  package = "idfkit"
  member = "idfkit/schemas/{directory}/Energy+.schema.epJSON.gz"

  # This step precedes the next by rule. The library returns the newest schema it has for a release
  # it does not list, so a conversion against an older level would publish the wrong field metadata
  # under the new heading without failing.
  [[project.step]]
  id = "library-level"
  title = "Library level carries the release"
