  [[project.step]]
  id = "target-list"
  title = "Add the release to the target list and designate it latest"
  class = "automated"
  run = 'uv run python -m scripts.adopt_release target-list {tag}'
    [project.step.verify]
    kind = "all"
      [[project.step.verify.of]]
      kind = "registry-lists"
      path = "scripts/config.py"
      pattern = '^\s*"(?P<release>v\d+\.\d+\.\d+)",$'
      form = "tag"
      [[project.step.verify.of]]
