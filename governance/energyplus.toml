  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/choosing-a-version.md"
  pattern = '\^(?P<release>\d+\.\d+\.\d+)'
  form = "full"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/getting-started.md"
  pattern = 'engine-assets@(?P<release>\d+\.\d+)(?!\.?\d)'
  form = "line"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/serving-and-assets.md"
  pattern = 'engine-assets@(?P<release>\d+\.\d+)(?!\.?\d)'
  form = "line"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/serving-and-assets.md"
  pattern = 'energyplus\.js-(?P<release>\d+\.\d+)\.wasm'
  form = "line"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/capability-support.md"
  pattern = 'energyplus\.js-(?P<release>\d+\.\d+)\.wasm'
  form = "line"

  [[project.statement]]
  path = "README.md"
  pattern = 'so a (?P<release>\d+\.\d+) file is not a valid input'
