# ==================================================================================================
# THE VERSION ROSTER
#
# Every project in the idfkit workspace that carries content depending on the EnergyPlus version:
# what must be observable before the project may adopt a release, the steps it performs, how each
# step is verified, and where the project states the latest release. The fifth governance artifact
# (feature 012).
#
# 1. WHAT IT NEVER HOLDS. An EnergyPlus version. The supported set is read from the location
#    [roster.supported_at] names. An adoption therefore changes nothing in this file and cuts no
#    governance tag. tools/energyplus/check_roster.py rejects any value that reads as a release,
#    except in the reason of a pin or an ignore.
#
# 2. HOW IT IS READ. By tools/energyplus/roster.py and by nothing else. A project's adoption
#    workflow reads it at the governance-YYYY.N tag on its `uses:` line. The watch and the sweep run
#    inside this repository and read the working tree.
#
# 3. HOW IT IS CHANGED. By pull request, reviewed by a maintainer of the other language through
#    CODEOWNERS. The `run` and `gate` values are commands executed in each project, which is the
#    reason the review is required. tools/energyplus/check_roster.py must pass.
#
# 4. THE FOUR DECLARATIONS. Every occurrence of the newest supported release in a project is one of:
#      statement   a path and a pattern whose `release` group is rewritten at adoption
#      generated   a path glob produced by a named step, never rewritten directly
#      pin         a path glob that names a release on purpose, with a reason, never rewritten
#      ignore      a path glob or a line pattern that is not an EnergyPlus version, with a reason
#    tools/energyplus/scan.py reports an occurrence under none of the four.
#
# 5. STEP CLASSES. `automated` steps are verified without a person. `reviewed` and `manual` steps
#    state the condition that justifies them (silent-effect, undecided-choice, publishes), the
#    reason, and what a person inspects. No step publishes, deploys, releases or merges.
#
# 6. A CHECK DOES NOT ESTABLISH A RELEASE. A `checks-green` or `accepted` verification holds only on
#    a commit on which every content verification of the same project holds (registry-lists,
#    path-exists, tag-exists, statements-current, published-carries). A green default branch that
#    does not carry the release therefore passes nothing.
# ==================================================================================================

[roster]
schema_version = "1"
upstream = "NatLabRockies/EnergyPlus"
review = "a maintainer of the other language, enforced by CODEOWNERS"

  [roster.supported_at]
  repository = "idfkit/idfkit"
  path = "src/idfkit/versions.py"
  pattern = '^\s*\((?P<release>\d+, \d+, \d+)\),'
  form = "tuple"

  [[roster.ignore]]
  glob = "**/*.lock"
  reason = "Lock files name third-party package versions."

  [[roster.ignore]]
  glob = "**/package-lock.json"
  reason = "Lock files name third-party package versions."

  [[roster.pin]]
  glob = "**/CHANGELOG.md"
  reason = "A changelog records what each past version changed."

  [[roster.pin]]
  glob = "specs/**"
  reason = "Specifications are a historical record of the state they were written against."

# ── The host ──────────────────────────────────────────────────────────────────────────────────────

[[project]]
id = "idfkit-conformance"
repository = "idfkit/idfkit-conformance"
content = ["expectations"]
gate = "python -m pytest tests -q"
# The record is written by the watch, by pull request, when every other step is resolved.
caller = false

  [[project.step]]
  id = "record-adoption"
  title = "Record the adoption"
  class = "automated"
    [project.step.verify]
    kind = "path-exists"
    path = "energyplus/adoptions/{full}.toml"

  [[project.pin]]
  glob = "cases/**"
  reason = "Each expectation records the release that produced it, and an adoption never changes a conformance expectation."

  [[project.pin]]
  glob = "manifest.json"
  reason = "Each expectation records the release that produced it, and an adoption never changes a conformance expectation."

  [[project.pin]]
  glob = "checks/**"
  reason = "Each expectation records the release that produced it, and an adoption never changes a conformance expectation."

  [[project.pin]]
  glob = "known-divergence.toml"
  reason = "Each expectation records the release that produced it, and an adoption never changes a conformance expectation."

  [[project.pin]]
  glob = "sweep-report.json"
  reason = "Each expectation records the release that produced it, and an adoption never changes a conformance expectation."

  [[project.pin]]
  glob = "runners/**"
  reason = "The runner contracts and their fixtures give examples at the release the expectations were produced with."

  [[project.pin]]
  glob = "README.md"
  reason = "The suite states the single release its expectations were produced with, which an adoption does not change."

  [[project.pin]]
  glob = "tests/**"
  reason = "Test fixtures name packages and versions as example input."

  [[project.pin]]
  glob = "energyplus/adoptions/**"
  reason = "An adoption record names the release it records and the evidence of each step. It is written once and never edited."

  [[project.pin]]
  glob = "governance/energyplus.toml"
  reason = "The roster states no release as a value. The reasons of its pins and ignores name the release a pinned file was written for."

  [[project.pin]]
  glob = "governance/naming.toml"
  reason = "The naming register names published packages and gives examples at a named release. It changes only by a reviewed governance change, never by an adoption."

  [[project.pin]]
  glob = "governance/parity.toml"
  reason = "The parity ledger records measurements and the state of each capability at a named release. It changes only by a reviewed governance change, never by an adoption."

# ── The first library ─────────────────────────────────────────────────────────────────────────────
[[project]]
id = "idfkit"
repository = "idfkit/idfkit"
content = ["schema", "types", "prose"]
publishes = ["idfkit"]
checks = "main.yml"
gate = "make check && make test"
after_merge = "Publish an idfkit version to the package index. Every project that resolves idfkit waits on it."

  [[project.opens_on]]
  kind = "upstream-assets"
  roles = ["linux-x86_64"]

  # The registry step precedes the schema step: the downloader refuses a version the registry does
  # not list.
  [[project.step]]
  id = "registry"
  title = "Add the release to the registry"
  class = "automated"
  run = 'uv run python scripts/adopt_energyplus.py register {full}'
    [project.step.verify]
    kind = "registry-lists"
    path = "src/idfkit/versions.py"
    pattern = '^\s*\((?P<release>\d+, \d+, \d+)\),'
    form = "tuple"

  # The bundled file is verified directly. The library can resolve a schema from a local EnergyPlus
  # installation, which would mask a missing bundle.
  [[project.step]]
  id = "bundle-schema"
  title = "Bundle the schema"
  class = "automated"
  run = 'uv run python -m idfkit.download {full} --target-dir src/idfkit/schemas'
    [project.step.verify]
    kind = "path-exists"
    path = "src/idfkit/schemas/{directory}/Energy+.schema.epJSON.gz"

  [[project.step]]
  id = "regenerate-stubs"
  title = "Regenerate type stubs"
  class = "automated"
  run = 'uv run python -m idfkit.codegen.generate_stubs'
    [project.step.verify]
    kind = "checks-green"
    workflow = "main.yml"

  [[project.step]]
  id = "regenerate-references"
  title = "Regenerate baked agent references"
  class = "automated"
  run = 'uv run python -m idfkit.codegen.bake_references'
    [project.step.verify]
    kind = "checks-green"
    workflow = "main.yml"

  [[project.step]]
  id = "sweep-row"
  title = "Add the example sweep row with its measured findings count"
  class = "reviewed"
  condition = "silent-effect"
  class_reason = "The count becomes a ceiling. A wrong ceiling hides defects without raising an error."
  inspect = "The findings and errors counts in the new matrix row, against the sweep's log for this release. Accept when both equal the measured values."
  run = 'uv run python scripts/adopt_energyplus.py sweep-row {full}'
  prepares = "The matrix row for the release, with findings and errors measured by reading that release's example files from the upstream tag against the bundled schema. The count per diagnostic code is in the pull request body."
    [project.step.verify]
    kind = "all"
      [[project.step.verify.of]]
      kind = "registry-lists"
      path = ".github/workflows/main.yml"
      pattern = '\{ version: "(?P<release>\d+\.\d+\.\d+)", findings:'
      form = "full"
      [[project.step.verify.of]]
      kind = "accepted"

  [[project.step]]
  id = "statements"
  title = "Rewrite statements"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.step]]
  id = "gate"
  title = "Pass the gate"
  class = "automated"
    [project.step.verify]
    kind = "checks-green"

  # Statements: the supported range, the latest release and the number of supported releases.

  [[project.statement]]
  path = "README.md"
  pattern = 'from v8\.9 through v(?P<release>\d+\.\d+)\.'
  form = "line"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = 'versions\.py\s+# Version registry \(8\.9\.0 through (?P<release>\d+\.\d+\.\d+)\)'
  form = "full"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = '# Bundled epJSON schemas for (?P<release>\d+) EnergyPlus versions'
  form = "count"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = 'Bundled schemas cover EnergyPlus 8\.9\.0 through (?P<release>\d+\.\d+\.\d+) \('
  form = "full"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = 'through \d+\.\d+\.\d+ \((?P<release>\d+) versions\)'
  form = "count"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = 'The latest supported version is (?P<release>\d+\.\d+\.\d+)\.'
  form = "full"

  [[project.statement]]
  path = "AGENTS.md"
  pattern = 'Bundled epJSON schemas \((?P<release>\d+) EnergyPlus versions\)'
  form = "count"

  [[project.statement]]
  path = "AGENTS.md"
  pattern = 'supports EnergyPlus versions 8\.9\.0 through (?P<release>\d+\.\d+\.\d+)\.'
  form = "full"

  [[project.statement]]
  path = "AGENTS.md"
  pattern = '^\| \d+\.\d+\.\d+ - (?P<release>\d+\.\d+\.\d+) \| Latest supported \|'
  form = "full"

  [[project.statement]]
  path = "agent_references/templates/parsing-idf-epjson.md"
  pattern = 'matching bundled schema \(8\.9 through (?P<release>\d+\.\d+) '
  form = "line"

  [[project.statement]]
  path = "agent_references/templates/schema-and-validation.md"
  pattern = 'for every supported version \(8\.9 → (?P<release>\d+\.\d+)\)'
  form = "line"

  [[project.statement]]
  path = "agent_references/templates/hvac-templates.md"
  pattern = '^## Complete enumeration \(EnergyPlus (?P<release>\d+\.\d+)\)'
  form = "line"

  [[project.statement]]
  path = ".github/workflows/main.yml"
  pattern = 'idfkit ships (?P<release>[a-z]+),'
  form = "count-word"

  [[project.statement]]
  path = ".github/workflows/main.yml"
  pattern = 'is permanent\. (?P<release>[A-Z][a-z]+)\n\s*# downloads happen once'
  form = "count-word"

  [[project.statement]]
  path = ".github/workflows/main.yml"
  pattern = '# The (?P<release>[a-z]+) versions idfkit bundles a schema for\.'
  form = "count-word"

  # Generated: files a step produces or extends.

  [[project.generated]]
  glob = "src/idfkit/versions.py"
  by_step = "registry"

  [[project.generated]]
  glob = "src/idfkit/schemas/**"
  by_step = "bundle-schema"

  [[project.generated]]
  glob = "src/idfkit/_generated_types.pyi"
  by_step = "regenerate-stubs"

  [[project.generated]]
  glob = "src/idfkit/document.pyi"
  by_step = "regenerate-stubs"

  [[project.generated]]
  glob = "src/idfkit/.agents/skills/developing-with-idfkit/**"
  by_step = "regenerate-references"

  [[project.generated]]
  glob = ".github/workflows/main.yml"
  by_step = "sweep-row"

  # Pins: text that is true of one release and does not change at adoption.

  [[project.pin]]
  glob = "tests/**"
  reason = "Tests and fixtures name the release whose behaviour they assert: models declaring Version 26.1, schema facts measured on 26.1.0, and output files written by EnergyPlus 26.1.0."

  [[project.pin]]
  glob = ".github/ep-testfiles.sparse"
  reason = "The comment records that the excluded example file is absent from EnergyPlus by 26.1, a fact about that release."

  [[project.pin]]
  glob = "src/idfkit/document.py"
  reason = "The docstring records a count of reference fields measured in the 26.1.0 schema."

  [[project.pin]]
  glob = "src/idfkit/validation.py"
  reason = "The docstring records a count of fields measured in the 26.1.0 schema."

  [[project.pin]]
  glob = "src/idfkit/idf_parser.py"
  reason = "The comments record a property of example files shipped with EnergyPlus 26.1.0."

  [[project.pin]]
  glob = "src/idfkit/scene.py"
  reason = "The comment records behaviour observed in EnergyPlus 26.1.0."

  [[project.pin]]
  glob = "src/idfkit/writers.py"
  reason = "The comment uses 26.1 as an example of a four-character version identifier when describing column drift."

# ── The engine ────────────────────────────────────────────────────────────────────────────────────
#
# The engine resolves neither library and is out of scope of the consumer register. It appears here
# because it carries content for exactly one EnergyPlus release per published asset package.
[[project]]
id = "idfkit-engine"
repository = "idfkit/idfkit-engine"
content = ["engine", "prose"]
publishes = ["@idfkit/engine-assets"]
checks = "ci.yml"
gate = "npm ci && npm run typecheck && npm test"
after_merge = "Publish the asset package for the release. Projects that run a simulation in the browser wait on it."

  [[project.opens_on]]
  kind = "upstream-assets"
  roles = ["linux-x86_64"]

  [[project.step]]
  id = "toolchain-row"
  title = "Propose the toolchain row, from the previous release's"
  class = "reviewed"
  condition = "silent-effect"
  class_reason = "A build that compiles can produce a binary that computes wrong results or fails at run time."
  inspect = "The proposed row in .github/energyplus-builds.json and the build it produced. Accept when the build succeeded and the row's status is not stronger than what was verified."
  run = 'node scripts/adopt-energyplus.mjs toolchain-row {full}'
  prepares = "A row for the release in .github/energyplus-builds.json with the previous release's emsdk and boost, and status untested."
    [project.step.verify]
    kind = "all"
      [[project.step.verify.of]]
      kind = "registry-lists"
      path = ".github/energyplus-builds.json"
      pattern = '"energyplus": "(?P<release>v\d+\.\d+\.\d+)"'
      form = "tag"
      [[project.step.verify.of]]
      kind = "accepted"

  [[project.step]]
  id = "build-engine"
  title = "Build the engine"
  class = "automated"
  # Dispatches the project's own build on the adoption branch and returns. The build takes about an
  # hour and creates the prerelease wasm-vX.Y.Z; a later run finds it present.
  run = 'node scripts/adopt-energyplus.mjs dispatch engine {full}'
    [project.step.verify]
    kind = "tag-exists"
    tag = "wasm-{tag}"

  [[project.step]]
  id = "source-patches"
  title = "Report the outcome of each source patch"
  class = "reviewed"
  condition = "silent-effect"
  class_reason = "Several patches depend on upstream source text and do nothing when it changed. A green build can lack a capability."
  inspect = "The per-patch report posted by the run: applied, skipped, or no change. Accept when every patch is applied, or each skipped patch is stated in the asset package's notes."
  run = 'node scripts/adopt-energyplus.mjs source-patches {full}'
  prepares = "One line per source patch with its outcome, in the pull request body."
    [project.step.verify]
    kind = "accepted"

  [[project.step]]
  id = "build-preprocessors"
  title = "Build the preprocessors"
  class = "automated"
  run = 'node scripts/adopt-energyplus.mjs dispatch preprocessors {full}'
    [project.step.verify]
    kind = "tag-exists"
    tag = "preprocessors-{tag}"

  [[project.step]]
  id = "compose-assets"
  title = "Compose the asset set"
  class = "automated"
  run = 'node scripts/adopt-energyplus.mjs dispatch compose {full}'
    [project.step.verify]
    kind = "registry-lists"
    path = "packages/engine-assets/package.json"
    pattern = '"version": "(?P<release>\d+\.\d+)\.\d+"'
    form = "line"

  [[project.step]]
  id = "asset-package"
  title = "Update the asset package (version, constants, notice)"
  class = "automated"
  run = 'node scripts/adopt-energyplus.mjs asset-package {full}'
    [project.step.verify]
    kind = "registry-lists"
    path = "packages/engine-assets/index.js"
    pattern = "energyPlusVersion = '(?P<release>\\d+\\.\\d+\\.\\d+)'"
    form = "full"

  [[project.step]]
  id = "third-party-notices"
  title = "Regenerate third-party notices"
  class = "reviewed"
  condition = "silent-effect"
  class_reason = "A licence statement. The project requires the link line to be read again for each build."
  inspect = "The regenerated THIRD_PARTY_NOTICES against the build's link line. Accept when every linked component is listed."
  run = 'node scripts/adopt-energyplus.mjs third-party-notices {full}'
  prepares = "packages/engine-assets/THIRD_PARTY_NOTICES regenerated from the upstream tag."
    [project.step.verify]
    kind = "accepted"

  [[project.step]]
  id = "e2e-fixtures"
  title = "Fetch end-to-end fixtures"
  class = "automated"
  run = 'node packages/engine/tests/fixtures/fetch-fixtures.mjs {full}'
    [project.step.verify]
    kind = "path-exists"
    path = "packages/engine/tests/fixtures/{full}"

  # References are generated from the release tarball on a Linux runner, not from a container image.
  [[project.step]]
  id = "differential-references"
  title = "Generate differential references from the release tarball"
  class = "automated"
  needs_energyplus = true
  run = 'node scripts/adopt-energyplus.mjs references {full}'
    [project.step.verify]
    kind = "path-exists"
    path = "packages/engine/tests/differential/reference/{full}"

  [[project.step]]
  id = "differential-comparison"
  title = "Pass the differential comparison"
  class = "automated"
    [project.step.verify]
    kind = "checks-green"
    workflow = "ci.yml"

  [[project.step]]
  id = "mark-verified"
  title = "Mark the release verified"
  class = "reviewed"
  condition = "silent-effect"
  class_reason = "The status asserts numerical agreement with the native engine. A wrong status alters simulation results without raising an error."
  inspect = "The differential report for the release. Accept when every case is within its recorded tolerance and no tolerance was changed."
    [project.step.verify]
    kind = "all"
      [[project.step.verify.of]]
      kind = "registry-lists"
      path = ".github/energyplus-builds.json"
      pattern = '"energyplus": "(?P<release>v\d+\.\d+\.\d+)",\s*"emsdk": "[^"]*",\s*"boost": "[^"]*",\s*"status": "verified"'
      form = "tag"
      [[project.step.verify.of]]
      kind = "accepted"

  [[project.step]]
  id = "statements"
  title = "Rewrite statements"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.statement]]
  path = "README.md"
  pattern = 'engine-assets@(?P<release>\d+\.\d+)(?!\.?\d)'
  form = "line"

  [[project.statement]]
  path = "README.md"
  pattern = 'assets-(?P<release>v\d+\.\d+\.\d+)'
  form = "tag"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = 'engine-assets@(?P<release>\d+\.\d+)   # EnergyPlus version \d+\.\d+\.\d+ software\nnpm install @idfkit/engine-assets@'
  form = "line"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = 'npm install @idfkit/engine @idfkit/engine-assets@(?P<release>\d+\.\d+)$'
  form = "line"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = '`@idfkit/engine-assets@(?P<release>\d+\.\d+)` and'
  form = "line"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = 'energyplus\.js-(?P<release>\d+\.\d+)\.wasm'
  form = "line"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = '# EnergyPlus version (?P<release>\d+\.\d+\.\d+) software\nnpm install @idfkit/engine-assets@'
  form = "full"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = '\*\*EnergyPlus version (?P<release>\d+\.\d+\.\d+) software\*\*'
  form = "full"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = '(?P<release>\d+\.\d+\.\d+)-build\.\d'
  form = "full"

  [[project.statement]]
  path = "packages/engine/README.md"
  pattern = '\^(?P<release>\d+\.\d+\.\d+)'
  form = "full"

  [[project.statement]]
  path = "packages/engine/AGENTS.md"
  pattern = 'engine-assets@(?P<release>\d+\.\d+)(?!\.?\d)'
  form = "line"
  occurrences = 3

  [[project.statement]]
  path = "packages/engine/AGENTS.md"
  pattern = 'EnergyPlus version (?P<release>\d+\.\d+\.\d+)\s+software'
  form = "full"
  occurrences = 2

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/choosing-a-version.md"
  pattern = 'engine-assets@(?P<release>\d+\.\d+)   # EnergyPlus version \d+\.\d+\.\d+ software\nnpm install @idfkit/engine-assets@'
  form = "line"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/choosing-a-version.md"
  pattern = '`@idfkit/engine-assets@(?P<release>\d+\.\d+)` and'
  form = "line"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/choosing-a-version.md"
  pattern = 'engine-assets@(?P<release>\d+\.\d+\.\d+)'
  form = "full"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/choosing-a-version.md"
  pattern = '# EnergyPlus version (?P<release>\d+\.\d+\.\d+) software\nnpm install @idfkit/engine-assets@'
  form = "full"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/choosing-a-version.md"
  pattern = 'bundles EnergyPlus version (?P<release>\d+\.\d+\.\d+)$'
  form = "full"

  [[project.statement]]
  path = "packages/engine/.agents/skills/using-idfkit-engine/references/choosing-a-version.md"
  pattern = '(?P<release>\d+\.\d+\.\d+)-build\.\d'
