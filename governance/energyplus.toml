  class = "reviewed"
  condition = "silent-effect"
  class_reason = "An upstream Sphinx directory that no configured set matches is skipped with a debug message and no failure, so a new document can be omitted from the published site without an error."
  inspect = "The list, in the pull request body, of upstream documentation directories that no configured set matches. Accept when each is either configured with a title or stated as excluded."
  run = 'uv run python -m scripts.adopt_release doc-sets {tag}'
  prepares = "The upstream documentation directories that no configured set matches, the configured sets found in neither tree, and the sets whose source format differs from the preceding release, in the pull request body."
    [project.step.verify]
    kind = "accepted"

  [[project.step]]
  id = "statements"
  title = "Rewrite statements"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.step]]
  id = "gate"
  title = "Pass the gate"
  class = "automated"
    [project.step.verify]
    kind = "checks-green"

