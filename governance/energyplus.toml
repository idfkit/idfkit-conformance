# ── The second library ────────────────────────────────────────────────────────────────────────────
[[project]]
id = "idfkit-js"
repository = "idfkit/idfkit-js"
content = ["schema", "types", "prose"]
publishes = ["@idfkit/schemas"]
checks = "main.yml"
gate = "npm ci && npm run typecheck && npm test"
after_merge = "Publish an idfkit-js version to the package index. Every project that resolves the scoped packages waits on it."

  # The second library builds its bundle from the first library's default branch, and its quality
  # job fails on any difference. It therefore opens on the merge and not on a publication.
  [[project.opens_on]]
  kind = "merged"
  project = "idfkit"
  step = "bundle-schema"

  [[project.step]]
  id = "rebuild-bundle"
  title = "Rebuild the schema bundle from idfkit"
  class = "automated"
  # The bundle is built from the first library's schemas. The command refuses while that library's
  # default branch does not bundle the release, because the build would succeed and add nothing.
  run = 'src="$(mktemp -d)" && git clone --quiet --depth 1 https://github.com/idfkit/idfkit.git "$src" && { test -f "$src/src/idfkit/schemas/{directory}/Energy+.schema.epJSON.gz" || { echo "The default branch of idfkit does not bundle {directory}, so the schema bundle cannot carry {full} yet." >&2; exit 1; }; } && npm ci && npm run build:schemas -- --source "$src/src/idfkit/schemas"'
    [project.step.verify]
    kind = "path-exists"
    path = "packages/schemas/data/manifest-{dashed}.json.gz"

  [[project.step]]
  id = "documented-versions"
  title = "Update the documented-versions mirror and its test constants"
  class = "automated"
  run = 'npm run sync:versions'
    [project.step.verify]
    kind = "registry-lists"
    path = "packages/core/src/docs-url/index.ts"
    pattern = "^\\s*'(?P<release>\\d+\\.\\d+\\.\\d+)',$"
    form = "full"

  [[project.step]]
  id = "sweep-row"
  title = "Add the sweep row"
  class = "reviewed"
  condition = "silent-effect"
  class_reason = "The count becomes a ceiling. A wrong ceiling hides defects without raising an error."
  inspect = "The findings and errors counts in the new matrix row, against the sweep's log for this release. Accept when both equal the measured values."
  run = 'npm ci && npm run typecheck && node scripts/add-sweep-row.mjs {full}'
  prepares = "The matrix row with the counts measured by the sweep over the release's example files. The sweep's report is in the pull request body."
    [project.step.verify]
    kind = "all"
      [[project.step.verify.of]]
      kind = "registry-lists"
      path = ".github/workflows/main.yml"
      pattern = '\{ version: "(?P<release>\d+\.\d+\.\d+)", findings:'
      form = "full"
      [[project.step.verify.of]]
      kind = "accepted"

  [[project.step]]
  id = "type-package"
  title = "Decide the type package for the release"
  class = "manual"
  condition = "undecided-choice"
  class_reason = "Type packages are published for a subset of releases and no recorded rule decides whether a new release receives one. A new package adds a public name."
  inspect = "The generated package and the wiring list. Accept a pull request that either adds the package with its wiring and a naming register entry, or records in this roster that none is published."
  run = 'src="$(mktemp -d)" && git clone --quiet --depth 1 https://github.com/idfkit/idfkit.git "$src" && npm run codegen:staged -- {full} --source "$src/src/idfkit/schemas"'
  prepares = "The generated package and WIRING.md, the list of the seven files that name a type package, in the artifact adoption-prepared of the run. Neither is part of the pull request."
    [project.step.verify]
    kind = "accepted"

  [[project.step]]
  id = "statements"
  title = "Rewrite statements"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.step]]
  id = "gate"
  title = "Pass the gate"
  class = "automated"
    [project.step.verify]
    kind = "checks-green"
    workflow = "main.yml"

