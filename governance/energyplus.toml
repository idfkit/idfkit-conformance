checks = "check.yml"
gate = "npm ci && npm run build"
after_merge = "Deploy the page by the project's own workflow."

  [[project.opens_on]]
  kind = "published"
  index = "npm"
  package = "@idfkit/schemas"
  member = "package/data/manifest-{dashed}.json.gz"

  [[project.opens_on]]
  kind = "published"
  index = "npm"
  package = "@idfkit/engine-assets"
  version_names_release = true

  [[project.step]]
  id = "release-constant"
  title = "Move the release constant, the asset pin, the model's version literal and the engine file name"
  class = "automated"
  # Refuses, and changes nothing, until an @idfkit/engine-assets version is published for the release.
  run = 'node scripts/adopt-energyplus.mjs {full}'
    [project.step.verify]
    kind = "all"
      [[project.step.verify.of]]
      kind = "registry-lists"
      path = "src/version.js"
      pattern = "ENERGYPLUS_VERSION = '(?P<release>\\d+\\.\\d+\\.\\d+)'"
      form = "full"
      [[project.step.verify.of]]
      kind = "registry-lists"
      path = "package.json"
      pattern = '"@idfkit/engine-assets": "(?P<release>\d+\.\d+)\.\d+"'
      form = "line"

  [[project.step]]
  id = "gate"
  title = "Pass the gate"
  class = "automated"
    [project.step.verify]
    kind = "checks-green"

  [[project.step]]
  id = "model-outside-browser"
  title = "Verify the model outside the browser"
  class = "manual"
  condition = "silent-effect"
  class_reason = "The project has no test runner. Its constitution requires a run of the generated model by a person, because a model that the page accepts can still fail in the engine."
  inspect = "The prepared models, run with the release's engine. Accept when each completes with no severe error."
  run = 'npm ci && node scripts/write-models.mjs && mkdir -p .energyplus-adoption && cp -R harness/energyplus-* .energyplus-adoption/'
  prepares = "The generated model at the shipped desk positions, with each channel toggled in turn, in the artifact adoption-prepared of the run."
    [project.step.verify]
    kind = "accepted"

  [[project.step]]
  id = "statements"
  title = "Rewrite statements, including licence text"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.statement]]
  path = "index.html"
  pattern = 'width of the `EnergyPlus (?P<release>\d+\.\d+\.\d+)` it sits under'
  form = "full"

  [[project.statement]]
  path = "index.html"
  pattern = 'id="t-engine-version">EnergyPlus (?P<release>\d+\.\d+\.\d+)<'
  form = "full"

  [[project.statement]]
  path = "index.html"
  pattern = 'EnergyPlus version (?P<release>\d+\.\d+\.\d+) software'
  form = "full"
  occurrences = 2

  [[project.statement]]
  path = ".interface-design/system.md"
  pattern = 'as wide as the `EnergyPlus (?P<release>\d+\.\d+\.\d+)` above it'
  form = "full"

  [[project.statement]]
  path = ".specify/memory/constitution.md"
  pattern = '\*\*EnergyPlus version\*\*: (?P<release>\d+\.\d+\.\d+), as bundled'
  form = "full"

  [[project.statement]]
  path = ".specify/memory/constitution.md"
  pattern = '^\s+(?P<release>\d+\.\d+\.\d+) locally, or the staged WebAssembly engine'
  form = "full"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = 'EnergyPlus (?P<release>\d+\.\d+\.\d+) is installed'
  form = "full"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = "load\\('(?P<release>\\d+\\.\\d+\\.\\d+)'\\)"
  form = "full"

  [[project.statement]]
  path = "CLAUDE.md"
  pattern = '/Applications/EnergyPlus-(?P<release>\d+-\d+-\d+)`'
  form = "dashed"

  [[project.statement]]
  path = "README.md"
  pattern = 'example \(EnergyPlus (?P<release>\d+\.\d+\.\d+)\)'
  form = "full"

  [[project.statement]]
  path = "README.md"
  pattern = 'energyplus\.js-(?P<release>\d+\.\d+)\.wasm'
  form = "line"

  [[project.statement]]
  path = "scripts/deploy.mjs"
  pattern = 'energyplus\.js-(?P<release>\d+\.\d+)\.wasm'
  form = "line"

  [[project.statement]]
  path = "src/model.js"
  pattern = "version_identifier: '(?P<release>\\d+\\.\\d+)'"
  form = "line"

  [[project.generated]]
  glob = "src/version.js"
  by_step = "release-constant"

  [[project.generated]]
  glob = "package.json"
  by_step = "release-constant"

  [[project.pin]]
  glob = "docs/design-notes.md"
  reason = "The design notes record measurements and decisions made against a named release."

  [[project.pin]]
  glob = "src/*.js"
  reason = "The source comments and citations record facts measured on the schema, the example files and the weather files of a named release."

[[project]]
id = "idfkit.com"
repository = "idfkit/idfkit.com"
content = ["prose"]
after_merge = "None. The site is served from its default branch."

  [[project.opens_on]]
  kind = "published"
  index = "npm"
  package = "@idfkit/engine-assets"
  version_names_release = true

  [[project.step]]
  id = "statements"
  title = "Rewrite statements"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.statement]]
  path = "index.html"
  pattern = '<li>EnergyPlus \d+\.\d+ through (?P<release>\d+\.\d+)</li>'
  form = "line"

# ── Deliveries of idfkit-mcp ──────────────────────────────────────────────────────────────────────
[[project]]
id = "idfkit-plugin"
repository = "idfkit/idfkit-plugin"
content = ["library-level", "prose"]
after_merge = "None. The plugin is installed from its default branch."

  [[project.opens_on]]
  kind = "project-complete"
  project = "idfkit-mcp"

  # The plugin pins the two servers, and each published server version declares the library level it
  # resolves. The level is followed through the server to the library.
  [[project.step]]
  id = "delivery-pins"
  title = "Delivery pins carry the release"
  class = "automated"
    [project.step.verify]
    kind = "all"
      [[project.step.verify.of]]
      kind = "published-carries"
      index = "pypi"
      package = "idfkit"
      member = "idfkit/schemas/{directory}/Energy+.schema.epJSON.gz"
        [project.step.verify.of.through]
        path = ".mcp.json"
        pattern = '"idfkit-mcp@(?P<level>[^"]+)"'
        via = "idfkit-mcp"
      [[project.step.verify.of]]
      kind = "published-carries"
      index = "pypi"
      package = "idfkit"
      member = "idfkit/schemas/{directory}/Energy+.schema.epJSON.gz"
        [project.step.verify.of.through]
        path = ".lsp.json"
        pattern = '"idfkit-lsp==(?P<level>[^"]+)"'
        via = "idfkit-lsp"

  [[project.step]]
  id = "statements"
  title = "Rewrite statements (skill text)"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.statement]]
  path = "skills/idf-conventions/SKILL.md"
  pattern = 'through the latest supported \(currently (?P<release>\d+\.\d+\.\d+)\)'
  form = "full"

  [[project.statement]]
  path = "skills/upgrade-version/SKILL.md"
  pattern = '\(currently (?P<release>\d+\.\d+\.\d+)\)'
  form = "full"
  occurrences = 2

[[project]]
id = "idfkit-mcp-deployment"
repository = "idfkit/idfkit-mcp-deployment"
content = ["runtime-image", "library-level", "prose"]
checks = "main.yml"
gate = "make check && make test"
merge_effect = "Merging this project's pull request deploys the hosted service."
after_merge = "Run the billable smoke test against the deployed service."

  [project.lag]
  kind = "deliberate"
  reason = "The hosted service adopts an EnergyPlus release only together with a reviewed change of its platform and billing, which no adoption run performs. Its default branch is behind the supported set by more than one release."

  [[project.opens_on]]
  kind = "project-complete"
  project = "idfkit-mcp"

  # On the default branch `app.py` builds for linux/amd64 from the x86_64 archive. The README row
  # that says ARM64, and the steps below, are to be reconciled with it before the lag is lifted.
  [[project.opens_on]]
  kind = "upstream-assets"
  roles = ["linux-x86_64"]

  # The archive name embeds a build hash and is taken from the release's asset list, never
  # constructed from the version.
  [[project.step]]
  id = "engine-archive"
  title = "Set the engine archive URL and its digest from the release's asset list"
  class = "automated"
    [project.step.verify]
    kind = "registry-lists"
    path = "app.py"
    pattern = 'EnergyPlus-(?P<release>\d+\.\d+\.\d+)-[0-9a-f]+-Linux'
    form = "full"

  [[project.step]]
  id = "smoke-constants"
  title = "Move the smoke test constants"
  class = "automated"
    [project.step.verify]
    kind = "statements-current"

  [[project.step]]
  id = "image-build"
  title = "Build the simulation image and run the engine's version command"
  class = "automated"
  needs_energyplus = true
    [project.step.verify]
    kind = "checks-green"
    workflow = "main.yml"

  [[project.step]]
  id = "gate"
  title = "Pass the gate"
  class = "automated"
    [project.step.verify]
    kind = "checks-green"

  [[project.step]]
  id = "billable-smoke"
  title = "Run the billable smoke test after deployment"
  class = "manual"
  condition = "publishes"
  class_reason = "The test spends real credits against the hosted service, and it can run only after a deployment, which the run never performs."
  prepares = "The command to run and the outcome to expect, in the pull request body."
  inspect = "The smoke test's output against the deployed service. Accept when a simulation at the release completes and is charged once."
    [project.step.verify]
    kind = "accepted"

  [[project.statement]]
  path = "README.md"
  pattern = '\| NatLabRockies (?P<release>v\d+\.\d+\.\d+) ARM64 \|'
  form = "tag"

  [[project.generated]]
  glob = "app.py"
  by_step = "engine-archive"

# ── Projects that carry no version-dependent content ──────────────────────────────────────────────
[[project]]
id = "idfkit-auth"
repository = "idfkit/idfkit-auth"
carries_none_reason = "An authentication front end. It reads and writes no model and names no EnergyPlus release."

[[project]]
id = "idfkit-org"
repository = "idfkit/.github"
carries_none_reason = "The organisation profile. It names no EnergyPlus release."

# ── End-to-end verifications (spec section 3.3) ───────────────────────────────────────────────────

[[verification]]
id = "parses-and-validates"
title = "A model at the release parses and validates in each library"
class = "automated"
  [verification.verify]
  kind = "all"
    [[verification.verify.of]]
    kind = "checks-green"
    repository = "idfkit/idfkit"
    workflow = "main.yml"
    [[verification.verify.of]]
    kind = "checks-green"
    repository = "idfkit/idfkit-js"
    workflow = "main.yml"

[[verification]]
id = "round-trips"
title = "A model at the release round-trips in each library"
class = "automated"
  [verification.verify]
  kind = "all"
    [[verification.verify.of]]
    kind = "checks-green"
    repository = "idfkit/idfkit"
    workflow = "main.yml"
    [[verification.verify.of]]
    kind = "checks-green"
    repository = "idfkit/idfkit-js"
    workflow = "main.yml"

[[verification]]
id = "migrates"
title = "A model at the previous release migrates to the release and validates"
class = "automated"
  [verification.verify]
  kind = "checks-green"
  repository = "idfkit/idfkit-engine"
  workflow = "ci.yml"

[[verification]]
id = "simulates"
title = "A model at the release simulates on each surface"
class = "automated"
  [verification.verify]
  kind = "checks-green"
  repository = "idfkit/idfkit-engine"
  workflow = "ci.yml"

[[verification]]
id = "documentation-published"
title = "The documentation for the release is published and designated latest"
class = "automated"
  [verification.verify]
  kind = "http-contains"
  url = "https://docs.idfkit.com/versions.json"
  pattern = '"title":\s*"(?P<release>\d+\.\d+\.\d+)",\s*"aliases":\s*\[\s*"latest"'
  form = "full"

[[verification]]
id = "range-stated"
title = "Every surface that states the supported range states the release"
class = "automated"
  [verification.verify]
  kind = "statements-current"
  project = "*"

[[verification]]
id = "conformance-passes"
title = "The conformance suite passes in both libraries"
class = "automated"
  [verification.verify]
  kind = "all"
    [[verification.verify.of]]
    kind = "checks-green"
    repository = "idfkit/idfkit"
    workflow = "conformance.yml"
    [[verification.verify.of]]
    kind = "checks-green"
    repository = "idfkit/idfkit-js"
    workflow = "conformance.yml"
