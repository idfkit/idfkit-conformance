# ---------------------------------------------------------------------------
# Entries: editing a document
# ---------------------------------------------------------------------------

[[entry]]
concept    = "add an object"
python     = "add"
typescript = "add"
kind       = "aligned"
notes      = """
`IDFDocument.add(obj_type, name, **fields)` against `IdfDocument.add(type, name, values)`. The
keyword-argument form is idiomatic Python and has no TypeScript equivalent, so the field values
arrive as an object literal there. Same verb, same argument order, same result.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "remove an object"
python     = "remove"
typescript = "remove"
kind       = "aligned"
notes      = """
Python spells it `IDFCollection.remove(obj)`; TypeScript spells it `IdfDocument.remove(obj)`. The
receiver differs because Python reaches a collection through `doc["Zone"]` and TypeScript through
`doc.all('Zone')`, which is the operator divergence recorded below, not a second verb.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "rename an object"
python     = "rename"
typescript = "rename"
kind       = "aligned"
notes      = """
The two signatures differ: Python's `IDFDocument.rename(obj_type, old_name, new_name)` against
TypeScript's `IdfDocument.rename(obj, next)`.

Both languages support `obj.name = new`, which is unambiguous in either, needs no object-type
argument, and repoints every reference in both implementations. That assignment is the PRIMARY PATH
and is what the documentation teaches on both sides. The method signatures are left alone rather
than forced into agreement: aligning them would rename a working method for a gain the assignment
form already delivers, and would spend a rename budget on syntax no reader has to use. Recorded per
research R14.
"""
rename_count = { python = 0, typescript = 0 }

