[[entry]]
concept    = "download a weather file"
python     = "WeatherDownloader.download"
typescript = "fetchWeatherFiles"
kind       = "divergent"
divergence_reason = """
Python's downloader is an object because it owns state a Python caller expects it to own: a cache
directory, its own session, and the settings that govern both. TypeScript's is a free function
because it owns none of that. It reaches the network through the global `fetch`, which the caller
overrides per call, and it caches nothing, so there is no instance for a method to hang on and
`fetch` names the platform primitive a JavaScript reader already knows.

The packaging and freshness consequences are recorded in the parity ledger under `weather-index`.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "refresh the station index"
python     = ""
typescript = "refreshStationIndex"
kind       = "divergent"
divergence_reason = """
Absent from Python because Python does it without being asked. `StationIndex.load()` probes upstream
at most once every 24 hours, warns when the bundled or cached index is behind, records the check
under the cache directory, and is turned off with IDFKIT_NO_WEATHER_UPDATE_CHECK, so a Python caller
needs no name for the operation.

JavaScript has no writable cache directory to throttle against in a browser, so the same nudge cannot
exist there. It exposes the refresh explicitly instead and does nothing on its own. A Python
counterpart would be a second public path to something already automatic, which FR-005 prohibits.
"""
