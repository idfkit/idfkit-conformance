# The naming register.
#
# The single public record of every concept shared by the two idfkit libraries, and of every
# accepted difference between them. A name that is not in this file is not finished.
#
# HOW THIS FILE IS READ
#
# Both naming gates, `idfkit/scripts/check_naming_register.py` and
# `idfkit-js/scripts/check-naming-register.mjs`, read this file at a pinned, immutable
# `governance-YYYY.N` tag of this repository. Reading it from the default branch is prohibited
# (FR-081): an unpinned read lets one repository turn the other's checks red without review on the
# consuming side. The governance tag series is separate from the `conformance-YYYY.N` corpus level
# series, so a rename does not force a corpus release.
#
# HOW THIS FILE IS RENDERED
#
# `idfkit/docs/explanation/naming-map.md` renders from this file at the same pinned tag. This file
# is the source; that page is a view. Hand-editing the page so that it disagrees with this file is
# the exact failure mode the split exists to prevent.
#
# HOW THIS FILE IS CHANGED
#
# Changes require review from a maintainer of the other language, enforced by CODEOWNERS in both
# repositories (FR-067). Names are decided here first and implemented afterwards (FR-007): an entry
# whose implementation does not exist yet is valid and required, and its `notes` say so.
#
# WHERE THIS FILE STOPS
#
# The register governs names. The corpus governs behaviour. Where the two disagree, neither wins
# silently: the disagreement blocks the merge and is resolved by amending whichever is wrong.

[register]
schema_version = "1"
governs = ["idfkit", "@idfkit/core", "@idfkit/weather"]
renders_to = "idfkit/docs/explanation/naming-map.md"
read_at = "a pinned governance-YYYY.N tag of idfkit-conformance, never the default branch"
review = "a maintainer of the other language, enforced by CODEOWNERS in both repositories"

# ---------------------------------------------------------------------------
# Entry schema
# ---------------------------------------------------------------------------
#
# Every `[[entry]]` carries these fields. The gates validate against this table.
#
#   concept            string           required   Unique across the register.
#   python             string           required   "" means absent in Python.
#   typescript         string           required   "" means absent in TypeScript.
#   kind               enum             required   aligned | divergent | excluded
#   divergence_reason  string           when kind is divergent or excluded. Must state why each
#                                                  side is correct in its own ecosystem.
#   canonical_form     string           when the value shape differs across the boundary. The text
#                                                  form both sides render (FR-004).
#   notes              string           optional   Free text. The primary path when two signatures
#                                                  coexist, or the fact that a name is registered
#                                                  ahead of its implementation.
#   rename_count       inline table     required   Per name, not per entry:
#                                                  { python = <int>, typescript = <int> }.
#
# THE ABSENT NAME IS "", NOT null
#
# The field contract in contracts/naming-register.md writes an absent name as `null`. TOML has no
# null literal, so this file spells it as the empty string. `python = ""` and `typescript = ""` mean
# absent in that language, and both gates read them that way. The rule is unchanged: a required
# field is always present, and its value says whether the name exists.
#
# THE RENAME COUNT, AND WHY IT IS PER NAME (FR-079, SC-003)
#
# `rename_count` records how many times each name has been changed during the unification feature.
# One rename is the budget. A name at 1 is spent: the naming gate BLOCKS any change that would take
# it to 2, and the block is not waivable by the gate. Taking a spent name to a second rename
# requires an amendment to this file, reviewed by both languages, that states why the first rename
# was wrong.
#
# This is what holds SC-003, zero names renamed more than once, at merge time, by construction,
# rather than confirming it by audit after the feature completes. An audit finds the second rename
# after users have already absorbed both.
#
# A withdrawal from the public surface counts as a rename. It is at least as breaking as one, and
# for the same reason it must not happen twice to the same name.
#
# A name at 0 whose entry is registered ahead of its implementation stays at 0 when it is written:
# writing a registered name is not a rename, which is the whole point of registering it first.

[gate]
# The exit contract lives in contracts/naming-register.md. Recorded here so that a reader of the
# file knows what it is enforced against.
exit_zero = "every public name in both libraries resolves to an entry"
failures = [
  "a public name has no entry: reports the name, its library, and the file it is exported from",
  "a concept has two public names in one language (FR-005): reports the concept and both names",
  "an excluded entry gains a counterpart in the other language (FR-006): reports the concept and the offending name",
  "a divergent entry has no divergence_reason: reports the concept",
  "a change takes a name to rename_count 2 (FR-079): reports the name and its first rename",
]
# Both gates report WHICH SIDE is behind the pinned register, not merely that the two disagree, and
# a reverted side stays blocked without the register entry being withdrawn (FR-003, FR-082).
reports_which_side_is_behind = true
# Assembly artefacts are not entries. A public surface exposing names never intended as public,
# module-import leakage included, fails the gate outright (FR-008). Those names are deleted, not
# registered.
assembly_artefacts_are_deleted_not_registered = true

# ---------------------------------------------------------------------------
# The aligned verb vocabulary
# ---------------------------------------------------------------------------
#
# Non-negotiable per Constitution Principle I. One operation, one verb, in both languages. A new
# capability that needs one of these operations spells it with the verb below, in the casing of its
# own ecosystem: snake_case in Python, camelCase in TypeScript.

[vocabulary]
verbs = ["parse", "load", "write", "save", "add", "remove", "rename", "validate"]

[vocabulary.meaning]
parse    = "read a model out of text already in memory. Never touches a disk"
load     = "read a model from a path. The disk-reading counterpart of parse"
write    = "serialize a model to text. Returns the text, never writes it"
save     = "serialize a model and put it on disk. The disk-writing counterpart of write"
add      = "create an object and attach it to the document"
remove   = "detach an object from the document"
rename   = "change an object's name and repoint every reference to it"
validate = "check a model or an object against its schema and report findings"

