[[entry]]
concept    = "diagnostics from a parse"
python     = "IDFParseError.diagnostics"
typescript = "ParseResult.diagnostics"
kind       = "divergent"
divergence_reason = """
Python raises and TypeScript returns. `IDFParseError` carries the diagnostics that stopped the
parse, which is how a Python caller expects to meet a failure it must handle, and the recoverable
findings go to the logging module. TypeScript's `parseIdf` returns a `ParseResult` whose
`diagnostics` array holds the non-fatal findings alongside the document, because a throwing parser
in a browser costs the caller the partial document it could still show.

Each is idiomatic where it lives. The difference is visible to a reader, so the parity ledger records
it under `parse-diagnostics` and the corpus asserts what each side reports for a malformed case.
"""
rename_count = { python = 0, typescript = 0 }

