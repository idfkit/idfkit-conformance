# ---------------------------------------------------------------------------
# Entries: permanently single-language surfaces (FR-006, FR-078)
# ---------------------------------------------------------------------------
#
# Each of these is one entry covering a whole surface, the way the eppy entry above does, because
# the names are quotations from one ecosystem rather than choices either language could share. The
# parity ledger records the same two capabilities as `local-simulation` and `svg-visualisation`,
# both with absence_kind = "never". Excluded is terminal: a counterpart appearing on the other side
# fails the gate, and adding one requires amending this entry.
#
# The two JavaScript-only mechanisms, @idfkit/engine and @idfkit/viewer, get NO entry here at all.
# Neither is reachable through the shared install name, and the reserved-package section below states
# why registering @idfkit/viewer would imply a claim this feature does not make. The parity ledger
# carries them as `browser-simulation` and `scene-rendering` with an empty `names` list for the same
# reason.

[[entry]]
concept    = "the local simulation surface"
python     = "simulate, simulate_batch, async_simulate, async_simulate_batch, async_simulate_batch_stream, find_energyplus, expand_objects, run_preprocessing, EnergyPlusConfig, SimulationResult, BatchResult, SimulationCache, SimulationJob, SimulationProgress, ESOResult, CSVResult, SQLResult, TimeSeriesResult, ErrorReport"
typescript = ""
kind       = "excluded"
divergence_reason = """
Running a locally installed EnergyPlus needs the installation and a subprocess to drive it, then
reads the eplusout files that run leaves on disk. Neither the installation nor the subprocess exists
in a browser, which is the runtime the JavaScript library targets, so these names are correct in
Python precisely because they name a mechanism JavaScript cannot have.

JavaScript reaches EnergyPlus by the other mechanism, a WebAssembly build in `@idfkit/engine`, which
is a different capability rather than a workaround for this one. Recording a JavaScript counterpart
here would make one language read as deficient at something it does not lack, which is what FR-068
and FR-078 forbid.

Narrowed on purpose. Choosing which variables to ask for and drawing the results are both pure and
both portable, so `select output variables for a run` and the plotting group above are registered
rather than excluded.
"""
notes = """
Live under idfkit/src/idfkit/simulation/. The names above are the register's named exclusions; the
same exclusion covers the rest of that subpackage, including the FileSystem family, the progress
reporters, and the remaining result readers. None of them crosses to TypeScript.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "the vector image surface"
python     = "construction_to_svg, generate_construction_svg, view_model, view_floor_plan, view_exploded, view_normals, ColorBy, ModelViewConfig, SVGConfig"
typescript = ""
kind       = "excluded"
divergence_reason = """
All nine produce a vector image handed back for a notebook, a report, or a file on disk, which is a
Python workflow. A JavaScript caller wanting to look at a model is already in a runtime that draws
and is served by the other mechanism, `@idfkit/viewer`, which renders an interactive scene. The two
are different capabilities, and merging them would make each language read as missing something the
other has.

Excluded is terminal here for the same reason it is terminal for the eppy surface: a JavaScript
counterpart would add public names that nothing calls, in a runtime that already draws.
"""
notes = """
Live at idfkit/src/idfkit/visualization/, nine exports, verified against `__all__`.
`construction_to_svg` and `generate_construction_svg` are two public names for one operation, which
FR-005 prohibits; that duplicate is resolved by the change that withdraws one, not here.
"""
rename_count = { python = 0, typescript = 0 }

# ---------------------------------------------------------------------------
# Reserved package names and entry points (FR-077)
# ---------------------------------------------------------------------------
#
# REGISTRATION ONLY. No package is built by this feature, and the `idfkit` facade's export map gains
# NO entry for any of these: an export map entry that resolves to nothing breaks a clean install,
# which is worse than the name being unreserved.
#
# The reservation exists for the same reason FR-007 does. A package name chosen at the moment its
# port begins is a package name chosen by one language under schedule pressure, and an npm package
# name cannot be corrected after publication without leaving the wrong one on the registry forever.
#
# The gates do not check these against any surface, because there is no surface to check. They are
# checked by review: a port that lands under a different package name than the one reserved here
# fails review, and changing a reservation is an amendment like any other.

[[reserved_package]]
capability   = "schedules"
npm_package  = "@idfkit/schedules"
subpath      = "idfkit/schedules"
mirrors      = ["idfkit.schedules"]
tier         = 2
built        = false
export_map_entry = false
notes = """
Mirrors the Python subpackage one-to-one. Reserved before the port begins so the eventual package
cannot be named `@idfkit/schedule` or `@idfkit/scheduling` by whoever writes it first.
"""

[[reserved_package]]
capability   = "geometry, geometry builders, surface matching, zoning"
npm_package  = "@idfkit/geometry"
subpath      = "idfkit/geometry"
mirrors      = ["idfkit.geometry", "idfkit.geometry_builders", "idfkit.surface_matching", "idfkit.zoning"]
tier         = 2
built        = false
export_map_entry = false
notes = """
One reserved package against four Python modules, deliberately. The four are one capability from a
user's point of view, and splitting them into four npm packages would make the JavaScript side
harder to install than the Python side for no gain. The geometry-extraction names registered above
are the first slice this package will carry.
"""

# NOT RESERVED, and the absence is a decision rather than an oversight.
#
#   @idfkit/viewer
#
# Scene rendering is a capability that exists only in JavaScript and is PERMANENTLY absent from
# Python (FR-078), just as vector-image visualisation exists only in Python and is permanently absent
# from JavaScript. Neither is a gap in the other, and the parity ledger records both as "never"
# rather than "not yet".
#
# It is built outside this feature, and it is installed by its own name the way `@idfkit/engine` is,
# rather than being reachable through the shared install name. Reserving `@idfkit/viewer` here would
# imply a claim this feature does not make: that scene rendering is part of the shared surface and
# is on some road map toward parity. It is not, in either direction.
#
# If that changes, the change adds the reservation here, with the reasoning, before the port begins.
