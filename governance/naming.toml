[[entry]]
concept    = "load a schema for a version"
python     = "get_schema"
typescript = "SchemaBundle.load"
kind       = "divergent"
divergence_reason = """
Python ships every schema inside the package and reads it from disk synchronously, so a module-level
`get_schema(version)` is enough and is what a Python reader expects. TypeScript cannot assume a
filesystem: a browser fetches the bundle over HTTP and a bundler-driven app resolves it through
`import()`, so the caller constructs a `SchemaBundle` over a `BundleSource` and loads from that. The
operation is a method on the object that owns the source because there is no process-wide source
that would let it be a free function. This is the input and output divergence recorded above.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "the supported version list"
python     = "ENERGYPLUS_VERSIONS"
typescript = "SchemaBundle.versions"
kind       = "divergent"
canonical_form = "string"
divergence_reason = """
Python's supported set is a constant because the schemas ship with the package, so the answer is
known at import time. TypeScript's depends on which bundle the caller supplied, so it can only be a
query on that bundle, and it is asynchronous for the same reason `SchemaBundle.load` is. A constant
there would name a set the library does not control.

Python's members are version tuples and TypeScript's are strings, which is the `version` divergence
recorded above. The string is canonical for anything crossing the boundary.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "resolve a version string"
python     = "find_closest_version"
typescript = "resolveVersion"
kind       = "divergent"
divergence_reason = """
Both answer the same question: given a version the caller has in hand, which supported release
should the model be read as. Python's takes the version tuple and consults the constant list, and
`closest` names what it does when the exact release is not supported. TypeScript's takes the
detected string and the list the bundle reports, so both are arguments, and `resolve` names the same
operation over the string form that is canonical across the boundary.

Neither signature exists in the other language, so neither name is a candidate for renaming to
match: the Python name would describe a search over a list TypeScript does not have, and the
TypeScript name would describe a resolution Python does not perform.
"""
rename_count = { python = 0, typescript = 0 }

# ---------------------------------------------------------------------------
# Entries: static types generated from the schema
# ---------------------------------------------------------------------------

[[entry]]
concept    = "generated object types"
python     = "idfkit._generated_types"
typescript = "@idfkit/core/types"
kind       = "divergent"
divergence_reason = """
Python generates one stub set at a time, ships it for the newest EnergyPlus release, and applies it
implicitly to every document through `idfkit/document.pyi`. TypeScript emits one type map per
version and the caller parameterises the document with the map for the version being read, so an
older model is typed as that older model or is left untyped.

Each mechanism is the one its type checker allows. Python cannot select a stub set per value, so an
implicit set is the only thing available; TypeScript has generics, so an opt-in map is both possible
and necessary for version-generic code. The consequence for a reader is recorded in the parity
ledger under `generated-object-types` rather than left here.
"""
rename_count = { python = 0, typescript = 0 }

