Identical names, different values, and recorded rather than reconciled for the same reason as
`version`: `files.epw` is a `Path` in Python and the EPW text in TypeScript, so code written from
one side's documentation reads against the other and is wrong at runtime.

Each is right where it lives, and the difference is the packaging asymmetry the parity ledger
records under `weather-index`. Python downloads into a cache directory, so paths are what it has and
what it should hand back, and `zip_path` and a guaranteed `ddy` follow from the same fact.
TypeScript writes nothing to disk, so text is the only thing it can return, and it carries the
undecoded members beside the three it decodes as a map of bytes.

