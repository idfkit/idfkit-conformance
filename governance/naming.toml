Running a locally installed EnergyPlus needs the installation and a subprocess to drive it, then
reads the eplusout files that run leaves on disk. Neither the installation nor the subprocess exists
in a browser, which is the runtime the JavaScript library targets, so these names are correct in
Python precisely because they name a mechanism JavaScript cannot have.

JavaScript reaches EnergyPlus by the other mechanism, a WebAssembly build in `@idfkit/engine`, which
is a different capability rather than a workaround for this one. Recording a JavaScript counterpart
here would make one language read as deficient at something it does not lack, which is what FR-068
and FR-078 forbid.

