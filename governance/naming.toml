# ---------------------------------------------------------------------------
# Entries: accepted divergences
# ---------------------------------------------------------------------------
#
# Each of these is a difference that stays. None is a defect, and none is a candidate for a future
# rename: forcing either spelling onto the other language makes it wrong there.

[[entry]]
concept    = "acronym casing"
python     = "IDFObject"
typescript = "IdfObject"
kind       = "divergent"
divergence_reason = """
PEP 8 capitalises every letter of an acronym inside a CapWords name, which gives `IDFObject`. The
Google TypeScript style guide treats an abbreviation as an ordinary word, which gives `IdfObject`.
Each spelling is the correct one in its own ecosystem, and forcing either onto the other makes it
wrong there and inconsistent with every neighbouring library its users already read.

The rule, not the single name: this governs `IDF*` against `Idf*` across both surfaces.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "the document class"
python     = "IDFDocument"
typescript = "IdfDocument"
kind       = "divergent"
divergence_reason = """
The acronym casing rule above. TypeScript's rename count is 1: the package shipped `IDFDocument`
alongside `IdfObject`, `IdfCollection`, and `IdfParseError`, so the old spelling contradicted both
its own neighbours and the Google rule. The rename batch fixes it, once.
"""
notes = "Breaking for anyone importing `IDFDocument` from `@idfkit/core@0.1.0`. Recorded in the changelog as such."
rename_count = { python = 0, typescript = 1 }

[[entry]]
concept    = "the collection class"
python     = "IDFCollection"
typescript = "IdfCollection"
kind       = "divergent"
divergence_reason = "The acronym casing rule above. Both sides already spell it correctly for their ecosystem."
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "the parse error type"
python     = "IDFParseError"
typescript = "IdfParseError"
kind       = "divergent"
divergence_reason = "The acronym casing rule above. Both sides already spell it correctly for their ecosystem."
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "every object of a type"
python     = "doc[\"Zone\"]"
typescript = "doc.all('Zone')"
kind       = "divergent"
divergence_reason = """
Python has operator overloading and `__getitem__` is the idiomatic spelling of keyed access;
TypeScript has no such operator, and an index signature on a class cannot carry the generic return
type that makes the call statically checked against the generated type map. `all()` is a method
because it has to be, and it is typed because that is the point of the type maps.

This is a syntactic divergence forced by the languages, not a naming disagreement, so neither side
is a candidate for renaming to match the other.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "untyped collection access"
python     = "IDFDocument.get_collection"
typescript = ""
kind       = "excluded"
divergence_reason = """
`IdfDocument.collection()` was public in `@idfkit/core@0.1.0` and is withdrawn to in-package use.
Two public methods for one operation is what FR-005 prohibits, and `all()` is the designed public
surface: `collection()`'s own doc comment describes itself as the escape hatch that exists so the
single unavoidable cast lives in one place. The version-generic case that would argue for keeping it
is already covered, because `all()` accepts unknown type names and returns them untyped.

Python's `get_collection` stays public: it is the named alternative to the `doc["Zone"]` operator
rather than a second untyped path, and Python has no generated type map narrowing to lose. Recorded
per research R1.
"""
notes = """
TypeScript's rename count is 1 and is spent on the withdrawal, which is as breaking as a rename and
must not happen twice. No third name is introduced: `untyped()` was considered and rejected, because
it would still be two public names and would invite users onto the untyped path for a case `all()`
already handles.
"""
rename_count = { python = 0, typescript = 1 }

[[entry]]
concept    = "one object, or nothing"
python     = "col.get(name)"
typescript = "col.get(name)"
kind       = "aligned"
notes      = "Returns `None` in Python and `undefined` in TypeScript, each language's own absent value."
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "one object, or an error"
python     = "col[name]"
typescript = "col.require(name)"
kind       = "divergent"
divergence_reason = """
Same reason as `doc["Zone"]`: Python spells throwing lookup with the subscript operator, which raises
`KeyError` on a miss and is what every Python reader expects of `[]`. TypeScript has no operator that
can throw here, so the throwing variant needs a name, and `require` says what it does at the call
site.

The contract is identical on both sides, and identical to `get` except for the miss: `get` returns
the absent value, this raises.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "collection to a sequence"
python     = "to_list()"
typescript = "toArray()"
kind       = "divergent"
divergence_reason = """
The sequence type is named differently by the two languages. Python's is `list` and `to_list` is the
conventional spelling; JavaScript's is `Array` and `toArray` matches `Array.from`, `toSorted`, and
every neighbouring API. Renaming either to the other's word would name a type that does not exist in
that language.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "an object's type name"
python     = "obj.obj_type"
typescript = "obj.typeName"
kind       = "divergent"
divergence_reason = """
Python's `obj_type` avoids shadowing the builtin `type`, which is the standard Python workaround and
reads naturally in snake_case. TypeScript has no such collision, and `typeName` is clearer than
`objType` in a language where `type` is a keyword only in type position. Both name the same string,
the EnergyPlus object type as the schema spells it.
"""
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "version"
python     = "doc.version"
typescript = "doc.version"
kind       = "divergent"
canonical_form = "string"
divergence_reason = """
Python returns `tuple[int, int, int]`, for example `(26, 1, 0)`. TypeScript returns `string`, for
example `"26.1.0"`.

This is worse than a rename and is recorded rather than reconciled. The name is identical, the prose
describing it is identical, and the value behaves differently, so code written from one side's
documentation compiles against the other and is wrong at runtime. Each language keeps its idiomatic
type: Python's tuple compares and sorts correctly with no helper, which is why `LATEST_VERSION`,
`MINIMUM_VERSION`, and `find_closest_version` are all tuples; TypeScript has no comparable tuple
literal and its schema keys, `resolveVersion`, `compareVersions`, and `versionKey` are all strings
already.

The STRING is canonical for anything crossing the boundary, because IDF text, epJSON, and the schema
keys are strings already. Python renders it with `version_string`. The corpus asserts that both
libraries render the same string for the same model (FR-004), so the divergence is documented AND
tested rather than documented only.
"""
notes = "No signature changes anywhere. This entry is documentation and a corpus case, not a rename."
rename_count = { python = 0, typescript = 0 }

[[entry]]
concept    = "all input and output"
python     = "synchronous"
typescript = "asynchronous"
kind       = "divergent"
divergence_reason = """
Python's file API is synchronous, its ecosystem is synchronous by default, and `load_idf(path)`
returning a document is what every Python reader expects. TypeScript's core is deliberately
synchronous and pure so that it runs unchanged in a browser, a worker, or an edge runtime; every
operation that touches a disk or a network is therefore pushed to `@idfkit/core/node` and is `async`,
which is the only shape a portable core can have without forcing `node:fs` into browser bundles.

Making Python async would be wrong for its ecosystem; making the TypeScript core sync would either
break the browser target or force the whole portable surface to be async just in case. The split is
the design, not an accident.
"""
notes = """
The verb pairs still align across the boundary: `parse` and `write` are sync and pure in BOTH
languages, and only `load` and `save` differ by being awaited in TypeScript.
"""
rename_count = { python = 0, typescript = 0 }

# ---------------------------------------------------------------------------
# Entries: excluded from alignment (FR-006)
# ---------------------------------------------------------------------------

[[entry]]
concept    = "eppy compatibility surface"
python     = "addidfobject, newidfobject, popidfobject, removeallidfobjects, getiddgroupdict, getobject, getsurfaces, idfobjects, saveas, savecopy, theidf, fieldnames, getreferingobjs, IDFObject.Name"
typescript = ""
kind       = "excluded"
divergence_reason = """
Fourteen aliases that exist to let code written against eppy, a Python library, run unchanged against
idfkit. They are correct in Python precisely because they are NOT idiomatic: they reproduce another
Python library's spelling, lowercase-run-together and all, so that a migration is a one-line import
change. `getreferingobjs` even reproduces eppy's misspelling of "referring", which is the clearest
possible evidence that these names are quotations rather than choices.

JavaScript has no eppy and no code to migrate, so a JavaScript counterpart would import a foreign
Python library's spelling into a language that never had it, and would add fourteen public names
that nothing calls. They are listed here individually, rather than described as a category, because
a category is something a future contributor can misread as "port these too". A name written out is
not portable by accident.

Excluded is terminal. A counterpart appearing on the TypeScript side fails the gate. Adding one
requires amending this entry, reviewed by both languages.
"""
notes = """
Live at `idfkit/src/idfkit/_compat.py` (`EppyDocumentMixin`, mixed into `IDFDocument`) and
`idfkit/src/idfkit/_compat_object.py` (`EppyObjectMixin`, mixed into `IDFObject`). The fourteen
above are the register's named exclusions; the same exclusion covers the whole of both mixins,
including the further eppy members reachable from the same surface (`addidfobjects`,
`removeidfobjects`, `copyidfobject`, `key`, `fieldvalues`, `getfieldidd`, `getfieldidd_item`,
`getrange`, `checkrange`, `save`, `run`, `update`). None of them crosses to TypeScript either.
"""
rename_count = { python = 0, typescript = 0 }

# ---------------------------------------------------------------------------
# Entries: geometry extraction, registered before the second-tier port begins (FR-007)
# ---------------------------------------------------------------------------
#
# Geometry is a second-tier capability and nothing is ported here. These names are registered now so
# that the first slice the port lands cannot be renamed afterwards: a name decided during a port is
# decided under schedule pressure, by one language, and is exactly the name that gets fixed later at
# a user's expense.
#
# Scope: READ-ONLY extraction. Vectors and polygons, reading surface coordinates, zone origin and
# rotation, the world transform, and the surface area, tilt, and azimuth calculations. Geometry
# AUTHORING (`set_surface_coords`, the builders, `set_wwr`, `translate_building`,
# `rotate_building`, surface matching, zoning) is a separate second-tier capability and is not
# registered here; it is registered by the change that ports it.
#
# The Python originals are in idfkit/src/idfkit/geometry.py.

