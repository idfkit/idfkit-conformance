Python generates one stub set at a time, ships it for the newest EnergyPlus release, and applies it
implicitly to every document through `idfkit/document.pyi`. TypeScript emits one type map per
version and the caller parameterises the document with the map for the version being read, so an
older model is typed as that older model or is left untyped.

Each mechanism is the one its type checker allows. Python cannot select a stub set per value, so an
implicit set is the only thing available; TypeScript has generics, so an opt-in map is both possible
and necessary for version-generic code. The consequence for a reader is recorded in the parity
ledger under `generated-object-types` rather than left here.
"""
