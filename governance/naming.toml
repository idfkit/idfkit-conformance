[[entry]]
concept    = "create a new document"
python     = "new_document"
typescript = "new IdfDocument(schema)"
kind       = "divergent"
divergence_reason = """
Python offers a module-level factory because the constructor needs a loaded schema the caller would
otherwise fetch itself, and because loading a schema in Python is synchronous, so the factory can do
it. `new_document()` also seeds the baseline singletons a usable model needs: Version, Building,
SimulationControl, and GlobalGeometryRules.

TypeScript loads a schema asynchronously from a `BundleSource`, and a constructor cannot await, so
the caller loads the schema first and hands it over. A synchronous factory is not available to write
there, which makes `new` both the idiomatic and the only possible spelling. This is the input and
output divergence recorded above, seen from the construction side.
"""
rename_count = { python = 0, typescript = 0 }

