# time.

# ---------------------------------------------------------------------------
# versions
# ---------------------------------------------------------------------------
#
# The four python entries on `versions-late-version-object` were removed on 2026-09-18, in the
# change that fixed the detector (idfkit#210, closing idfkit#185). All four went together because
# all four were the same refusal: the read raised, so there was no document for the epjson,
# round-trip and preserved-text assertions to compare. Fixing the parse made all four pass at once,
# and a passing case with an entry still standing is a failure the runner reports, so the entries
# go with the fix rather than after it. This section is now empty, and is kept so that the next
# version divergence has a place rather than a precedent to invent.

# ---------------------------------------------------------------------------
# preserved-text: the absence ended, and its 46 entries went with it
# ---------------------------------------------------------------------------
#
# `conformance-2026.9` carried one typescript entry per case declaring this assertion, 46 of them,
# all naming idfkit-js 12. The assertion was cut while the second language failed it, which is what
# made the corpus the specification of the behaviour rather than a check applied afterwards.
#
# `conformance-2026.10` is that level with those entries gone. They were removed by the change that
# landed the preserving writer, because a case passing while its entry remains is a failure and not
# a pass: the runner collects stale entries and fails the run. This is the second time the corpus
# has done that, after the tier1-introspection-field-shapes entry in the change that closed
# introspection.

# ---------------------------------------------------------------------------
# preserved-text and parse-outcome: two first-language bugs that were already tracked
# ---------------------------------------------------------------------------
#
# FR-025 forbids recording a finding the preserving writer exposes in the first language as an
# accepted divergence: that language already claims this capability, so a finding there is fixed
# rather than accepted. Four were found and four were fixed, in the release the corpus runs
# against: the no-op field write, the object-notation removal, the missing version_first in the
# refusal guard, and the silent drop of a control set on the default path.
#
# These two are not that. They are idfkit 185 and idfkit 187, both open before this feature and
# both already carrying entries on other assertions of the same cases. A new assertion and a new
# case surface the same two bugs a third and a fourth time, and an entry that names the issue
# already tracking them is the honest record. Fixing 185 and 187 makes both stale together with
# their siblings.
#
# 185 is now fixed and its entry here went with the rest of its siblings, which is what the
# sentence above predicted. 187 is now fixed too (idfkit#243): an unterminated final object is a
# ParseError finding at the object's start line, raised in strict mode and returned by
# load_idf_with_diagnostics otherwise. Its entry here went with its two siblings on
# malformed-truncated-object, the parse-outcome and diagnostics entries, and the malformed section
# they emptied went with them. This section now holds no entry. The paragraph is kept rather than
# rewritten, because it named the condition correctly before either bug was fixed.
