case      = "malformed-truncated-object"
library   = "python"
assertion = "parse-outcome"
issue     = "https://github.com/idfkit/idfkit/issues/187"
observed  = '''Reading succeeds in about 30 ms and returns a document of Version and Building only. The unterminated GlobalGeometryRules object is discarded with no diagnostic of any kind, because _OBJECT_PATTERN at idf_parser.py:297 matches only text that reaches a semicolon, so an unterminated tail matches nothing at all.'''
expected  = '''Reading fails. ConvertInputFormat refuses the file, with "UpperLeft" plus its newline matching no member of the starting_vertex_position enumeration, and the TypeScript core refuses it too, with "Unterminated object near UpperLeft (missing semicolon) (line 8)". Losing an object in silence is the hazard: the caller cannot distinguish this file from one that never held the object. The second half of the bug is recorded in the case itself: the same pattern nests a quantified group inside a quantified group and backtracks exponentially in the length of the unterminated tail, 34 ms at thirteen characters and over 100 s at thirty.'''

