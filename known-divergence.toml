[[divergence]]
case      = "numeric-autocalculate-casing"
library   = "typescript"
assertion = "epjson"
issue     = "https://github.com/idfkit/idfkit-js/issues/8"
observed  = '''The three Zone sentinels echo the file's casing verbatim: /Zone/Sentinel Zone/ceiling_height "autocalculate", /volume "AUTOCALCULATE", /floor_area "AutoCalculate". Three spellings of one sentinel produce three different epJSON values, so a consumer testing for equality against "Autocalculate" matches none of them.'''
expected  = '''All three are "Autocalculate", the schema's own casing, whatever casing the IDF used. Python already does this; the sweep found 37,164 occurrences across 722 example files where the TypeScript core does not.'''

[[divergence]]
case      = "numeric-autosize-casing"
library   = "typescript"
assertion = "epjson"
issue     = "https://github.com/idfkit/idfkit-js/issues/8"
observed  = '''The three coils echo the file: /Coil:Heating:Electric/Lower Coil/nominal_capacity "autosize", /Upper Coil/nominal_capacity "AUTOSIZE", /Mixed Coil/nominal_capacity "AutoSize". This is the autosize half of the same sentinel bug as numeric-autocalculate-casing.'''
expected  = '''All three are "Autosize". The three coils differ only in the casing they wrote and must be indistinguishable in the epJSON.'''

[[divergence]]
case      = "numeric-sentinel-schema-remap"
library   = "typescript"
assertion = "epjson"
issue     = "https://github.com/idfkit/idfkit-js/issues/9"
observed  = '''/AirTerminal:SingleDuct:VAV:Reheat/Reheat Terminal/maximum_flow_fraction_during_reheat is "AUTOCALCULATE", the file's as-written casing, with neither canonicalisation nor a remap to the field's declared sentinel.'''
expected  = '''"Autosize", the one sentinel that field's schema enum ["", "Autosize"] names. Fixing the casing bug alone (numeric-autocalculate-casing) would yield "Autocalculate" here and still be wrong.'''

