# The exception register: every disagreement the corpus currently produces, accepted so the suite
# can land green and start blocking new drift before the bugs it found are fixed (FR-018).
#
# An entry is not a blessing. It is a bug with a tracked resolution, and the runners print every
# outstanding entry with its issue link on every run rather than suppressing it. An entry whose
# case now passes is a failure, not a pass: the change that fixes the bug removes the entry.
#
# Every entry carries a real tracking issue, opened 2026-09-02 (task T040). The URL form is forced:
# `Divergence.__post_init__` in runners/model.py and its mirror in runners/model.mjs both require
# `issue` to match ^https?://\S+$, so an entry cannot be added without one.
#
# The entries group by root cause rather than one per failing assertion: idfkit 178 to 187,
# idfkit-js 7 to 11 and 26. Two bugs exist identically in BOTH libraries, choice-field casing
# (idfkit 180, idfkit-js 10) and latin-1 decoding of UTF-8 input (idfkit 186, idfkit-js 11). A bug
# in both languages is still one entry per language: fixing one side turns that side's entry stale,
# which the runner reports as a failure, and the change that fixes it removes it. This header once
# read that such issues "must land together"; idfkit-js 10 landed alone on 2026-09-10 and the
# register followed it, one entry at a time, with the python half of the same bug still recorded.
#
# Counts, recounted from this file when idfkit stopped dropping an unterminated final object in
# silence (idfkit#187) and its three python entries, parse-outcome and diagnostics on
# malformed-truncated-object and parse-outcome on preserve-unterminated-final, were removed with the
# two malformed sections they emptied: 7 entries over 4 issues and 5 cases, 2 against python and 5
# against typescript, on a corpus of 74 cases and 226 assertions. Before that, when idfkit stopped
# storing a blank fixed field as "" (idfkit#183)
# and its two python round-trip entries, for numeric-zero-against-blank and
# positional-trailing-unset-no-extensible, were removed with the positional section they emptied: 10
# entries over 5 issues and 7 cases, 5 against python and 5 against typescript, on a corpus of 74
# cases and 226 assertions. Before that, when @idfkit/core landed its side of the multi-field update
# (idfkit-js#80 and #81) and its six typescript entries for the update cases were removed: 12
# entries over 6 issues and 9 cases, 7 against python and 5 against typescript, on a corpus of 74
# cases and 226 assertions. No entry for the update cases remains, and none tracks idfkit#235. When
# the five update cases landed, the file held 28 entries over 7 issues and 14 cases, 17 against
# python and 11 against typescript; when idfkit landed IDFObject.update, its ten python entries went,
# leaving 18. Before the update cases, and after idfkit#179 to idfkit#182 were fixed,
# the file held 12 entries over 6 issues and 9 cases, 7 against python and 5 against typescript, on
# a corpus of 69 cases and 211 assertions. Before that fix it held 17 entries, although this
# paragraph still stated the 21 counted against idfkit 1.0.0rc2 and @idfkit/core 0.3.0-rc.3 with
# idfkit-js#60 applied. Four entries went away in e60b74d, when both libraries started agreeing
# about blank names, and the typescript half of types-choice-field-casing went away with idfkit-js
# 10. This header stated 22 entries over 47 cases until 2026-09-04, 20 over 12 cases until the
# preserved-text assertion landed, and 22 over 12 issues until choice casing was fixed in the second
# language; it is recounted from the file and from the runner's own tally rather than adjusted, and
# it is recounted again whenever a case lands.

#
# The tier1-introspection-field-shapes entry was removed on 2026-09-04, in the change that closed
# the introspection capability. It was the one entry that recorded no bug: it pinned a divergence
# the parity ledger declared, so that the ledger's prose could not quietly stop being true. It did
# its job. The library populated all three families, the entry went stale, the runner failed on the
# stale entry, and the ledger moved to complete in the same change that removed it.

