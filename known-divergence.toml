# ---------------------------------------------------------------------------
# tier1
# ---------------------------------------------------------------------------

[[divergence]]
case      = "tier1-introspection-field-shapes"
library   = "typescript"
assertion = "introspection"
issue     = "https://github.com/idfkit/idfkit-js/issues/26"
observed  = '''27 differences, in the three families the parity ledger already records for this capability, and no others. First, memo and note are null everywhere: 3 object memos and 5 field notes. Second, enum_values is null on the three anyOf fields, ceiling_height, volume and floor_area, where Python recovers ["", "Autocalculate"] from the string branch. Third, enum_values omits the leading empty string on the three plain enum fields, which shifts every remaining member one index early and accounts for 16 of the 27.

All three come out of describeObjectType rather than out of the runner, and all three come out of the schema bundle rather than out of the introspection code. @idfkit/schemas drops memo and note deliberately to keep the bundle off the parse critical path, keeps the anyOf string branch enum under a separate key that describe.ts does not read, and filters the empty string out of the enum it does read.'''
expected  = '''The description Python produces: memo on all three types, note on the five Zone fields that carry one, ["", "Autocalculate"] for the three anyOf fields, and the leading empty string present on every enum that declares it.

This entry is the parity ledger made enforceable. governance/parity.toml records introspection as typescript = "partial" and names exactly these three differences in its prose; until now nothing checked that the prose was still true. The case was written to fail rather than written around: choosing a type whose memo happens to be absent would have hidden a difference the ledger already admits to. If TypeScript ever populates any of the three, this entry goes stale, the runner fails, and the ledger has to be corrected in the same change.

The fix is not in describe.ts alone. Two of the three families need @idfkit/schemas to carry data it currently discards, which is a bundle-size decision rather than a port omission, and issue 26 is where that trade-off is tracked.'''

