# canonicalisation in the JavaScript library (idfkit-js#60, closing idfkit-js#10). Its case now
# passes, and a passing case with an entry still standing is a failure the runner reports, so the
# entry goes with the fix rather than after it.
#
# The python entry was removed in the change that fixed idfkit#180, which canonicalises a choice
# value to the schema's spelling in the epJSON writer, as idfkit-js#60 does. The same change fixed
# idfkit#181 and removed the python entry on numeric-sentinel-schema-remap; the typescript entry on
# that case stays until idfkit-js#9 is fixed. This header once said the four entries on the two
# both-language bugs "must land together"; the pairing is real for the bug and not for the
