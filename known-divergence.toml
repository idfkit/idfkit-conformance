observed  = '''The Material:NoMass object is keyed "è¯éª". The six UTF-8 bytes E8 AF 95 E9 AA 8C are decoded one byte at a time as latin-1, so the object is not lost but its epJSON key, which is its identity, is mojibake.'''
expected  = '''The Material:NoMass object is keyed "试验", carrying {"roughness": "Rough", "thermal_resistance": 5.0}. EnergyPlus itself accepts UTF-8 object names here.'''

[[divergence]]
case      = "encoding-utf8-object-name"
library   = "typescript"
assertion = "epjson"
issue     = "https://github.com/idfkit/idfkit-js/issues/11"
observed  = '''The Material:NoMass object is keyed "è¯éª", the identical latin-1 corruption Python produces, which is why the bootstrap sweep reported this shape against both sides at once.'''
