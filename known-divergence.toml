[[divergence]]
case      = "encoding-latin1-high-bytes"
library   = "python"
assertion = "epjson"
issue     = "https://github.com/idfkit/idfkit/issues/186"
observed  = '''/Output:Variable/Output:Variable 1/key_value is "Café Zürich Zone". The file's 0xE9 and 0xFC are read as latin-1 and the accented characters are preserved intact.'''
expected  = '''/Output:Variable/Output:Variable 1/key_value is "Caf<U+FFFD> Z<U+FFFD>rich Zone". ConvertInputFormat decodes the file as UTF-8 and substitutes one U+FFFD replacement character (bytes EF BF BD) for each byte that is not valid UTF-8. Preserving the byte is arguably the better behaviour; the corpus records what the oracle does, and this entry is where that is argued.'''

