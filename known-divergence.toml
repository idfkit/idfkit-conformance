[[divergence]]
case      = "numeric-zero-against-blank"
library   = "python"
assertion = "round-trip"
issue     = "https://github.com/idfkit/idfkit/issues/183"
observed  = '''Re-parsing Python's own write_idf output yields a Zone of 4 fields against the original 7: /Zone/0/fields is length 4 on the left and 7 on the right. The parsed document keeps the three trailing blank slots (type, multiplier, ceiling_height) as the empty string, write_idf drops them, so the write is lossy against the model. The epjson assertion passes because write_epjson strips those same empty strings, which is exactly why only assertion 3 sees this.'''
expected  = '''Re-parsing deep-equals the original document. Either the parser stops at the last set field, as the TypeScript core does and as the oracle output implies, or the writer preserves what the parser kept. The model and the two writers must not disagree about whether a trailing blank is a field.'''

