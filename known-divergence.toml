observed  = '''Reading raises VersionNotFoundError: "Could not detect EnergyPlus version in file". _detect_version in idfkit/idf_parser.py slices header = content[:10240] and runs _VERSION_PATTERN over that prefix only, and get_idf_version (line 641) reads f.read(10240) the same way. The Version object in this input sits at byte 10502, so the detector never sees it. The bootstrap sweep hit this on three real example files, including RefBldgPrimarySchoolNew2004_Chicago.idf.'''
