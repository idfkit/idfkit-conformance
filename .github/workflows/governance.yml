# Validate the governance artifacts on every pull request.
#
# `governance/README.md` step 2 of "Cutting a governance tag" has always said the repository's own
# CI runs these checks on the pull request. Until feature 002 it did not: `.github/` held only
# CODEOWNERS. A malformed entry could therefore reach an immutable `governance-YYYY.N` tag with
# nothing but review standing between it and both libraries, and a tag cannot be moved once cut.
#
# This job is deliberately narrow. It never installs either library and never imports one, so it
# cannot be turned red by a library's own drift. It answers only whether the record is internally
# well formed. Whether the code matches the record is each library's own gate, run in that
# library's repository against a pinned tag.
name: governance

on:
  pull_request:
    paths:
      - "governance/**"
      - "known-divergence.toml"
      - "manifest.json"
      - "cases/**"
      # `checks/` carries its own fixtures and its own committed expectations, and none of
      # it is indexed by `manifest.json`. Without this line a pull request touching only a
      # check runs no job at all in this repository.
      - "checks/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tomllib is in the standard library from 3.11. The validator reads TOML and nothing else,
      # so there is no dependency to install and no lock file to keep in step.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the governance artifacts
        run: python tools/validate_governance.py

      # The fourth artifact (feature 004). The only thing permitted to call consumers.toml well
      # formed, and it runs here so a malformed roster cannot reach an immutable tag (T025).
      - name: Validate the consumer register
        run: python tools/check_consumers.py

      # The register's tools each carry tests that prove the check can fail: a schema rule, a
      # sweep, a rename scan and an ordering that never reject anything are indistinguishable from
      # none (T026, T032, T047). pytest is the only dependency, pinned for the same reason the
      # linters in both libraries are.
      - name: Test the register's tools
        run: |
          python -m pip install --quiet pytest==9.1.1
          python -m pytest tests -q

      # The case manifest is the corpus's own index. A case that does not agree with it reaches a
      # runner as an unexplained error rather than a failed assertion, so this loads the whole
      # corpus the way the runners do: every entry resolves to a directory, every directory is
      # indexed, every declared input and expectation file exists, every manifest entry agrees with
      # its case.toml, and every accepted divergence names a case that is really there.
      #
      # `load_corpus` imports nothing from either library, so this stays the narrow check.
      - name: Validate the case manifest against the cases
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "runners")
          from model import load_corpus

          corpus = load_corpus(Path("."))
          cases = len(corpus.cases)
          assertions = sum(len(entry.assertions) for entry in corpus.manifest.entries())
          json.loads(Path("manifest.schema.json").read_text())
          print(f"manifest.json agrees with cases/: {cases} cases, {assertions} assertions")
          print(f"corpus_level {corpus.manifest.corpus_level!r}")
          PY
