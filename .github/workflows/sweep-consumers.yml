# The scheduled sweep (feature 004, research R3, FR-008).
#
# The only check that can find a repository nobody registered, because an unregistered repository
# runs no self-check. It reads every registered consumer's level from the declaration the register
# names, compares each with what the registries publish, and walks the organisation for anything that
# depends on either library and is not on the roster.
#
# IT READS THE WORKING TREE, NOT A TAG, and that is the one exception to FR-002: it runs inside this
# repository and reports on the file it runs beside. Every other reader pins a tag.
#
# IT READS PRIVATE REPOSITORIES THROUGH THE ORGANISATION'S GITHUB APP. idfkit-app,
# idfkit-mcp-deployment and idfkit-engine are private, and GITHUB_TOKEN sees only this repository.
# The idfkit-bot app is installed on every repository in the organisation with read access to
# contents, so this job mints a token from it for the whole installation: the sweep has to list and
# read every repository to find a stranger, so the token is deliberately not narrowed.
#
# An app rather than a personal access token, by the user's choice: the token belongs to no person,
# lives an hour instead of months, and the same pair of secrets (APP_ID, APP_PRIVATE_KEY) serves
# every workflow in the organisation that reaches across repositories. Without them the job refuses
# to sweep, with exit 2. It never goes green by not looking.
#
# Exit 1: at least one stranger. Exit 2: no stranger found, and something could not be checked.
# The two are never merged, because a permissions failure that read as an all-clear is the bug this
# feature was written about.

name: sweep-consumers

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to sweep blind
        if: env.HAS_APP != 'true'
        run: |
          echo "::error title=No app credentials::APP_ID and APP_PRIVATE_KEY are not set, so private repositories cannot be read and the sweep would report them as unreachable. Set them; see the header of this workflow."
          exit 2

      - name: Mint a token for the whole installation
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sweep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python tools/sweep_consumers.py --out consumer-report.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-report
          path: consumer-report.json
          if-no-files-found: error
