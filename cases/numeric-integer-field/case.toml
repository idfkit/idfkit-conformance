title = "An integer-typed field written with a decimal point stays an integer"
why = """
A handful of fields are typed integer in the schema rather than number: Timestep's
number_of_timesteps_per_hour, Zone's type and multiplier, Building's warmup day counts. IDF has no
types, so a model may write 6.0 into any of them and remain valid input, and models generated by
other tools routinely do. ConvertInputFormat emits 6, not 6.0, because the schema type decides the
form.

What this case pins is not that a library reproduce the integer form. It cannot, in JavaScript,
which has no integer type to reproduce it with, and the comparison rules therefore say that an
integer against a float is not a difference. What it pins is that the value survives at all: a
reader that keeps 6.0 as the string "6.0" because it saw a decimal point in an integer field, or one
that truncates 3.0 to something other than 3, produces a document that fails the schema. The case
also guards the comparison rule itself, since a comparator that started distinguishing 6 from 6.0
would turn every integer field in the corpus red without a single library changing.
"""
tags = ["numeric", "types"]
energyplus_version = "26.1.0"
truth = "oracle"
assertions = ["parse-outcome", "epjson", "round-trip"]
