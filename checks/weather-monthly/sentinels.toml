units = "mm"
values = [{ value = 999, kind = "missing", means = "not measured" }]

[[field]]
field = "Liquid Precipitation Quantity"
position = 34
units = "hr"
values = [{ value = 99, kind = "missing", means = "not measured" }]

# ---------------------------------------------------------------------------
# The text fields
# ---------------------------------------------------------------------------
#
# Listed so that a reader enumerating this file knows they exist and are not numeric. Position 27
# looks numeric and is not: it holds a nine-digit composite of nine single-digit observations, so
# "999999999" is nine observations of 9 rather than the number nine hundred and ninety-nine million.

[[field]]
field = "Data Source and Uncertainty Flags"
position = 5
units = ""
text = true
values = []

[[field]]
field = "Present Weather Codes"
position = 27
units = ""
text = true
values = []
