# The field this whole file's shape exists for. Three reserved values, of which one is an absence
# and two are observations. See the header for the corpus counts.
[[field]]
field = "Ceiling Height"
position = 25
units = "m"
values = [
  { value = 99999, kind = "missing", means = "not measured" },
  { value = 77777, kind = "observation", means = "unlimited ceiling height" },
  { value = 88888, kind = "observation", means = "cirroform ceiling" },
]

# A flag rather than a quantity. Its 9 says no observation was made, which makes the Present Weather
# Codes field beside it meaningless for that hour; it is not a missing measurement of its own.
[[field]]
field = "Present Weather Observation"
position = 26
units = ""
values = [
  { value = 0, kind = "observation", means = "weather observation made; the codes field is meaningful" },
  { value = 9, kind = "missing", means = "weather observation not made, or missing" },
]

[[field]]
field = "Precipitable Water"
position = 28
units = "mm"
values = [{ value = 999, kind = "missing", means = "not measured" }]

[[field]]
field = "Aerosol Optical Depth"
position = 29
units = "thousandths"
values = [{ value = 0.999, kind = "missing", means = "not measured" }]

[[field]]
field = "Snow Depth"
position = 30
units = "cm"
values = [{ value = 999, kind = "missing", means = "not measured" }]

# The document reserves 99. Both sampled files, from two different producers, hold 88 for every hour
# of the year. 88 is therefore neither the missing value nor a documented reserved value nor
# plausibly a measurement. It is recorded in `check.md` as an observation about the data and is
# deliberately NOT given a meaning here: inferring one from a constant is the empirical derivation
# this file exists to avoid.
[[field]]
field = "Days Since Last Snowfall"
position = 31
units = ""
values = [{ value = 99, kind = "missing", means = "not measured" }]

[[field]]
field = "Albedo"
position = 32
units = ""
values = [{ value = 999, kind = "missing", means = "not measured" }]

[[field]]
